<style>

body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;touch-action:manipulation;user-select:none}

.chip.on{border-color:var(--cur)}.chip.dead{opacity:.4;text-decoration:line-through}
.dot{width:12px;height:12px;border-radius:50%}
#status{padding:0 10px 4px;font-weight:600}
#map{flex:1;min-height:0;margin:0 8px;background:var(--sea);border-radius:12px;touch-action:none}

button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;min-height:44px}

#ov .box,#cv .box{background:var(--card);border-radius:16px;padding:20px;max-width:380px;width:100%}
input{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);width:100%;box-sizing:border-box;margin:4px 0 10px;background:var(--bg);color:var(--fg)}
h1{margin:0 0 6px;font-size:22px}.sm{color:var(--mut);font-size:13px}

 const cs=S.players[i].cards||[],can=canAct()&&S.phase==="reinforce"&&S.players[S.turn].id===uid,forced=can&&cs.length>=5,ok=csel.length===3&&okSet(csel.map(k=>cs[k]));
 cv.style.display="flex";
 $("cvb").innerHTML=`<h1>🃏 Your cards (${cs.length})</h1><div class="sm">Next set is worth <b>${tval(S.sets||0)}</b> armies. ${forced?"<b>You must trade (5+ cards).</b>":"You earn a card at the end of any turn where you conquered a territory. Trade during Reinforce."}</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0">${cs.map((c,k)=>`<button data-k="${k}" style="min-width:92px;border-width:3px;border-color:${csel.includes(k)?"var(--cur)":isW(c)?"#999":CC[CO[c]]}"><div style="font-size:24px">${csym(c)}</div><div class="sm">${cname(c)}</div></button>`).join("")||"<span class='sm'>No cards yet.</span>"}</div><button class="p" id="tr" ${ok&&can?"":"disabled"}>Trade selected</button> <button id="at" ${can&&findSet(cs)?"":"disabled"}>Auto-trade</button> <button id="cx" ${forced?"disabled":""}>Close</button><div class="sm" style="margin-top:8px">Set = 3 of one symbol, one of each, or any 3 including a ⭐ wild. Trading a card for a territory you own gives +2 armies there.</div>`;
 $("cvb").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;csel=csel.includes(k)?csel.filter(x=>x!==k):csel.length<3?csel.concat(k):csel;renderCards()});
 $("tr").onclick=()=>{if(trade(csel)){csel=[];save()}};$("at").onclick=()=>{if(trade(findSet(cs))){csel=[];save()}};$("cx").onclick=()=>{cOpen=false;csel=[];renderCards()}}
const hb={};let fortN=0,lastPh="";
const fresh=u=>u===uid||(hb[u]&&Date.now()-hb[u]<25000);
const gone=p=>!!p.away&&!!S&&S.phase in PH;
const driver=()=>{const h=S.players.find(p=>!p.ai&&fresh(p.id));return !!h&&h.id===uid};
function addAI(){if(!S||S.players.length>=4)return;S.players.push({id:"ai"+Math.random().toString(36).slice(2,7),name:"Bot "+(S.players.filter(p=>p.ai).length+1),ai:true});save()}
const enemyAdj=i=>ADJ[i].filter(j=>S.terr[j].o!==S.terr[i].o);
function aiStep(){
 if(!S||!(S.phase in PH)||!driver())return;const pl=S.players[S.turn];if(!(pl.ai||gone(pl)))return;
 force=true;
 try{const me=S.turn,own=[...T.keys()].filter(i=>S.terr[i].o===me);
  if(S.phase!==lastPh){lastPh=S.phase;fortN=0}
  if(S.phase==="reinforce"){
   {const pc=S.players[me];while((pc.cards||[]).length>=3){const st=findSet(pc.cards);if(!st)break;trade(st)}}
   while(S.pool>0){let b=own[0],bs=-1e9;own.forEach(i=>{const e=enemyAdj(i),s=e.length?e.reduce((a,j)=>a+S.terr[j].a,0)-S.terr[i].a+5:-S.terr[i].a-20;if(s>bs){bs=s;b=i}});S.terr[b].a++;S.pool--}
   S.phase="attack";save()}
  else if(S.phase==="attack"){
   let bs=1,bm=null;own.forEach(i=>{const a=S.terr[i].a;if(a<2)return;enemyAdj(i).forEach(j=>{const s=a-S.terr[j].a+Math.random()*.5;if(s>=2&&s>bs){bs=s;bm=[i,j]}})});
   if(bm)attack(bm[0],bm[1],true);else next()}
  else{
   const dist={},q=own.filter(i=>enemyAdj(i).length);q.forEach(i=>dist[i]=0);
   for(let k=0;k<q.length;k++){const i=q[k];ADJ[i].forEach(j=>{if(S.terr[j].o===me&&dist[j]===undefined){dist[j]=dist[i]+1;q.push(j)}})}
   let mv=null;own.forEach(i=>{if(S.terr[i].a>1&&dist[i]>0)ADJ[i].forEach(j=>{if(!mv&&S.terr[j].o===me&&dist[j]<dist[i])mv=[i,j]})});
   if(mv&&fortN++<8){S.terr[mv[1]].a+=S.terr[mv[0]].a-1;S.terr[mv[0]].a=1;save()}else next()}
 }finally{force=false}}
setInterval(()=>{if(joined)render()},4000);
function showJoin(msg){$("ovb").innerHTML=`<h1>⚔️ Risk Online</h1><div class="sm">2–4 players. Conquer all 34 territories.${msg?`<br><b>${msg}</b>`:""}</div><label class="sm">Your name</label><input id="nm" maxlength="14" placeholder="Player"><label class="sm">Room code (share with friends)</label><input id="rm" maxlength="12" value="RISK"><button class="p" id="go">Join room</button><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><label class="sm">Or play alone against</label><select id="nb" style="font:inherit;padding:10px;border-radius:8px;width:100%;margin:4px 0 10px;background:var(--bg);color:var(--fg);border:1px solid var(--line)"><option value="1">1 computer player</option><option value="2" selected>2 computer players</option><option value="3">3 computer players</option></select><button id="solo">Play solo vs bots</button>`;$("go").onclick=()=>join();$("solo").onclick=()=>soloStart()}
function soloStart(){const n=+$("nb").value;myName=($("nm").value.trim()||"You").slice(0,14);ref=null;solo=true;window._room="solo";
 S={players:[{id:uid,name:myName}],phase:"lobby",log:[]};for(let i=1;i<=n;i++)S.players.push({id:"ai"+i,name:"Bot "+i,ai:true});
 joined=true;src=-1;start()}
async function join(){const db=window._db;if(!db){showJoin("Online rooms need claude.ai while signed in — solo play still works.");return}
 myName=($("nm").value.trim()||"Player").slice(0,14);const code=($("rm").value||"RISK").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,12)||"RISK";window._room=code;
 ref=db.doc("risk/"+code);
 try{const s=await ref.get();let d=s.exists?s.data():{players:[],phase:"lobby",log:[]};d.players=d.players||[];
  if(!d.players.some(p=>p.id===uid)&&d.phase==="lobby"&&d.players.length<4){d.players.push({id:uid,name:myName});await ref.set(d)}
  joined=true;
  const hbc=ref.collection("hb"),beat=()=>hbc.doc(uid).set({t:Date.now()}).catch(()=>{});beat();setInterval(beat,5000);
  hbc.onSnapshot(qs=>{qs.docs.forEach(d=>{const x=d.data();if(x)hb[d.id]=x.t});render()},()=>{});
  addEventListener("pagehide",()=>{try{hbc.doc(uid).set({t:0})}catch(e){}});
  ref.onSnapshot(sn=>{S=sn.exists?sn.data():null;
   if(S&&S.phase==="lobby"&&myIdx()<0&&S.players.length<4)setTimeout(()=>{if(S&&S.phase==="lobby"&&myIdx()<0&&S.players.length<4){S.players.push({id:uid,name:myName});save()}},200+Math.random()*500);
   if(S&&S.terr&&S.phase in PH&&!S.players[S.turn].dead===false)cur=cur;
   render()},()=>{});
  render()}catch(e){showJoin("Could not join: "+(e.message||e.code))}}

/* ===== network layer: server-authoritative (see server.js) ===== */
let ws=null,last=null;
const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};
save=function(){render()};
act=function(i){if(!canAct())return;const t=S.terr[i],p=S.turn;
 if(S.phase==="reinforce"){if((S.players[p].cards||[]).length>=5){cOpen=true;render();return}send({t:"place",i});return}
 if(S.phase==="attack"){if(t.o===p&&t.a>1)src=src===i?-1:i;else if(src>=0&&t.o!==p&&ADJ[src].includes(i))send({t:"attack",s:src,d:i});else src=-1;render();return}
 if(S.phase==="fortify"){if(t.o!==p)src=-1;else if(src>=0&&src!==i&&ADJ[src].includes(i)){send({t:"fort",s:src,d:i});return}else src=t.a>1?i:-1;render()}};
attack=function(s,d,blitz){send({t:"attack",s,d,blitz:!!blitz})};
next=function(){send({t:"next"})};
autoPlace=function(){if(!canAct()||S.phase!=="reinforce")return;if(S.pool===0)return send({t:"next"});if((S.players[S.turn].cards||[]).length>=5){cOpen=true;render();return}send({t:"auto"})};
trade=function(idx){if(!idx||idx.length!==3)return false;const cs=idx.map(i=>S.players[S.turn].cards[i]);if(!okSet(cs))return false;send({t:"trade",idx});return true};
start=function(){send({t:"start"})};
addAI=function(){send({t:"bot"})};
function connect(o){last=o;window._room=o.room;
 ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
 ws.onopen=()=>send({t:"join",room:o.room,name:o.name,uid,solo:o.solo||0});
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.t==="state"){S=m.S;joined=true;
   if(src>=0&&(!S.terr||S.terr[src].a<2||S.players[S.turn].id!==uid||!(S.phase==="attack"||S.phase==="fortify")))src=-1;
   render()}
  else if(m.t==="err"){if(joined)$("log").textContent=m.msg;else showJoin(m.msg)}};
 ws.onclose=()=>{if(last===o){if(joined)$("status").textContent="Reconnecting…";setTimeout(()=>{if(last===o)connect(o)},1500)}}}
join=function(){const code=($("rm").value||"RISK").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,12)||"RISK";
 connect({room:code,name:($("nm").value.trim()||"Player").slice(0,14)})};
soloStart=function(){const n=+$("nb").value;solo=true;
 connect({room:"S"+Math.random().toString(36).slice(2,8).toUpperCase(),name:($("nm").value.trim()||"You").slice(0,14),solo:n})};
(()=>{try{uid=localStorage.getItem("rk")}catch(e){}
 if(!uid||uid.length<8){uid=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,"0")).join("");try{localStorage.setItem("rk",uid)}catch(e){}}
 showJoin()})();
</script></body></html>
