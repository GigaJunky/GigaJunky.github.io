<style>
/* Layout: one 16:9 arcade stage, letterboxed under a slim toolbar; single deliberate night theme */
:root{
  --bg:#07061a; --panel:#141033; --ink:#f6ecff; --muted:#a99cc9; --amber:#ffc35a; --teal:#2fd6c0; --line:rgba(255,205,140,.22);
  --display:'Bungee',Impact,'Arial Black',sans-serif; --ui:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
#wrap{height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#bar{width:100%;max-width:1600px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:18px;letter-spacing:.04em;color:var(--amber)}
#status{font-size:13px;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:600 13px/1 var(--ui);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--amber)}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#bVR{background:var(--amber);color:#1a1033;border-color:var(--amber)}
#bVR:disabled{opacity:.6;cursor:wait}
#stage{position:relative;display:grid;place-items:center;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.6);background:#000;max-width:100%}
#stage:fullscreen{border-radius:0}
canvas#cv{display:block;touch-action:none;cursor:crosshair}
#touch{position:absolute;inset:0;pointer-events:none}
.pad{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:14px;width:150px;height:150px;pointer-events:auto}
.pad button,.fire{position:absolute;width:52px;height:52px;border-radius:14px;background:rgba(20,16,51,.55);border:1px solid rgba(255,220,160,.35);font-size:20px;padding:0;touch-action:none;user-select:none;-webkit-user-select:none}
.pad [data-k=up]{left:49px;top:0}.pad [data-k=down]{left:49px;bottom:0}.pad [data-k=left]{left:0;top:49px}.pad [data-k=right]{right:0;top:49px}
.fire{right:calc(18px + env(safe-area-inset-right,0px));bottom:30px;width:84px;height:84px;border-radius:50%;pointer-events:auto;font:700 14px var(--ui);background:rgba(255,195,90,.3)}
.pad button.on,.fire.on{background:rgba(255,195,90,.55)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div id="wrap">
  <header id="bar">
    <div class="brand"><span class="logo">Sailor Man</span><span id="status">Keyboard · Mouse · Touch · Gamepad · VR</span></div>

      <button id="bVR" type="button" hidden>Enter VR</button>

  </header>
  <div id="stage">
    <canvas id="cv" aria-label="Sailor Man game"></canvas>
    <div id="touch" hidden>
      <div class="pad">
        <button type="button" data-k="up" aria-label="Up">▲</button>
        <button type="button" data-k="left" aria-label="Left">◀</button>
        <button type="button" data-k="right" aria-label="Right">▶</button>
        <button type="button" data-k="down" aria-label="Down">▼</button>
      </div>
      <button type="button" class="fire" data-k="punch">PUNCH</button>
    </div>
  </div>
</div>

<script>
(()=>{

 {kind:'street',name:'Olive Street',pal:0,ledge:[260,700],start:480,

function mulberry(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const DISP='"Bungee", Impact, "Arial Black", sans-serif', UI='"Fredoka", system-ui, sans-serif';

const PALS=[
 {sky:['#1d1446','#6a2c66','#f08c52'],cloud:'#d1748a',far:'#3a2350',far2:'rgba(120,60,110,.55)',farWin:'#ffb36b',wall:'#7a3e32',wall2:'#66332a',mortar:'rgba(255,215,190,.11)',slab:'#a48170',slabTop:'#f2c9ac',slabDark:'#2a1726',win:'#ffc861',winDark:'#22142a',roof:'#5a2e3e',roofLine:'#7c4352',water:['#2b3b72','#0d1432'],moon:'#ffe6c2',lamp:'rgba(255,190,110,1)',aurora:false},
 {sky:['#040818','#0f1f4a','#284a7e'],cloud:'#3a5288',far:'#121c3c',far2:'rgba(40,70,130,.5)',farWin:'#ffd27a',wall:'#3b4470',wall2:'#2c3358',mortar:'rgba(0,0,0,.3)',slab:'#4f6aa8',slabTop:'#b9cdf6',slabDark:'#0c1022',win:'#ffd37d',winDark:'#121630',roof:'#c0392b',roofLine:'#f3efe6',water:['#10284e','#040b1c'],moon:'#f4f1ff',lamp:'rgba(255,210,140,1)',aurora:false},
 {sky:['#020d14','#06303a','#0f5a52'],cloud:'#2a6e6a',far:'#0a2228',far2:'rgba(30,90,90,.5)',farWin:'#c9ffd9',wall:'#5a3a26',wall2:'#4c311f',mortar:'rgba(0,0,0,.32)',slab:'#8a6a48',slabTop:'#e2c89c',slabDark:'#1c120a',win:'#ffe6a0',winDark:'#0c1e20',roof:'#2d5a58',roofLine:'#357068',water:['#0b3340','#020d12'],moon:'#e8fff4',lamp:'rgba(255,225,160,1)',aurora:true}
];

// ================= audio =================
// The Sailor's Hornpipe (traditional, public domain), 8 bars of eighth notes; -1 = rest

 [69,74,78,81,79,78,76,74],[73,76,79,76,73,69,71,73],[74,78,81,78,79,76,73,76],[74,73,71,69,74,-1,-1,-1]];
const AU={ctx:null,on:true,mode:'off',pending:'title',step:0,next:0,
 init(){
  if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;

  this.rev=a.createConvolver();this.rev.buffer=this.impulse(2.4);const rg=a.createGain();rg.gain.value=.4;this.rev.connect(rg);rg.connect(this.master);
  const nb=a.createBuffer(1,a.sampleRate,a.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=nb;

 },
 setOn(v){this.on=v;if(this.master)this.master.gain.setTargetAtTime(v?.9:0,this.ctx.currentTime,.05)},
 impulse(sec){const a=this.ctx,len=Math.floor(a.sampleRate*sec),b=a.createBuffer(2,len,a.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}return b},

  if(o.slide)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t+dur);

 noise(t,dur,o={}){

 music(m){if(!this.ctx){this.pending=m;return}if(m===this.mode)return;this.mode=m;this.step=0;this.next=this.ctx.currentTime+.06},

   if(this.mode!=='off')this.playStep(this.step,this.next);

 wood(t,v){this.tone(t,98,.015,{type:'sine',vol:v,rel:.03});this.noise(t,.02,{type:'bandpass',f:2500,q:4,vol:v*.8})},
 squeeze(t,m,dur,v){ // concertina-ish lead: two detuned reeds + breath

 playStep(st,t){

   case 'catch':{const up=arg||0;[76,79,83,88].forEach((m,i)=>this.tone(t+i*.045,m+up,.08,{type:'square',vol:.05,cut:5000,dest:D,rev:.25}));this.tone(t+.18,95+up,.3,{type:'triangle',vol:.06,dest:D,rev:.6});break}
   case 'toss':this.tone(t,96,.05,{type:'triangle',vol:.04,dest:D,rev:.6});this.tone(t+.05,91,.08,{type:'triangle',vol:.03,dest:D,rev:.6});break;
   case 'land':this.tone(t,86,.04,{type:'sine',vol:.05,dest:D,rev:.3});break;
   case 'punch':this.noise(t,.13,{type:'bandpass',f:1400,f2:350,q:1.4,vol:.3,dest:D});break;
   case 'cackle':[0,1,2,3,4].forEach(i=>this.tone(t+i*.09,66+(i%2?4:0)-i*.5,.08,{type:'sawtooth',vol:.05,cut:1500,vib:40,dest:D,rev:.3}));break;
   case 'drop':this.tone(t,80,.35,{type:'sine',vol:.05,slide:2000,dest:D,rev:.3});break;
   case 'bong':this.tone(t,52,.5,{type:'sine',vol:.2,dest:D,rev:.5});this.tone(t,64.5,.35,{type:'square',vol:.05,cut:1400,dest:D});this.noise(t,.08,{type:'bandpass',f:1200,q:3,vol:.2,dest:D});break;
   case 'boing':this.tone(t,50,.55,{type:'sine',vol:.14,slide:900,vib:60,dest:D,rev:.2});this.tone(t,57,.4,{type:'triangle',vol:.05,slide:1400,dest:D});break;
   case 'clank':this.noise(t,.22,{type:'highpass',f:3500,vol:.3,dest:D,rev:.3});[100,104,97,108].forEach((m,i)=>this.tone(t+i*.025,m,.05,{type:'sine',vol:.05,dest:D,rev:.4}));break;

   case 'whistle':this.tone(t,84,.25,{type:'sine',vol:.07,slide:1900,dest:D,rev:.3});this.tone(t+.25,91,.35,{type:'sine',vol:.07,vib:60,dest:D,rev:.3});this.tone(t+.6,91,.2,{type:'sine',vol:.06,slide:1000,dest:D,rev:.4});break;

   case 'power':for(let i=0;i<10;i++)this.tone(t+i*.04,64+i*3,.07,{type:'square',vol:.045,dest:D,rev:.3});this.tone(t,40,.55,{type:'sawtooth',vol:.05,slide:1400,cut:3000,dest:D});break;
   case 'berry':this.tone(t,88,.1,{type:'sine',vol:.04,dest:D,rev:.7});this.tone(t+.09,93,.14,{type:'sine',vol:.04,dest:D,rev:.7});break;

   case 'burn':this.noise(t,.75,{type:'lowpass',f:2400,f2:180,vol:.22,dest:D});this.tone(t+.1,64,.22,{type:'triangle',vol:.09,dest:D});this.tone(t+.36,60,.4,{type:'triangle',vol:.09,dest:D});break;
   case 'life':[72,76,79,84,88,91].forEach((m,i)=>this.tone(t+i*.06,m,.1,{type:'square',vol:.045,dest:D,rev:.3}));break;

function steer(e,tx,tf){

 for(const k of CON)if(up?k.t===e.floor-1:k.t===e.floor){const ex=up?k.x1:k.x0,ox=up?k.x0:k.x1,d=Math.abs(ex-e.x)+Math.abs(ox-tx)*.35;if(d<bd){bd=d;best=k}}

}

  if(e.y<=FY[k.t]){e.y=FY[k.t];e.floor=k.t;e.x=k.x0;e.climb=null}
  else if(e.y>=FY[k.t+1]){e.y=FY[k.t+1];e.floor=k.t+1;e.x=k.x1;e.climb=null}
  else{e.x=lerp(k.x0,k.x1,(e.y-FY[k.t])/span);if(k.st&&e.moving)e.face=Math.sign((k.x1-k.x0)*e.dir)||e.face}

  if(i.up&&k.t===e.floor-1&&Math.abs(k.x1-e.x)<13){e.climb=k;e.x=k.x1;e.dir=-1;return}

 for(const gp of pads){if(!gp)continue;const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed),prev=gpPrev[gp.index]||{};const ax=gp.axes[0]||0,ay=gp.axes[1]||0;

function update(dt){

 updParts(dt);G.shake=Math.max(0,G.shake-dt*1.6);
 switch(G.mode){
  case 'title':updMira(dt,false);if(inp.start){AU.init();startGame()}break;
  case 'over':updMira(dt,false);G.stateT-=dt;if(G.stateT<=0&&inp.start)startGame();break;
  case 'ready':updMira(dt,false);G.stateT-=dt;if(G.stateT<=0)G.mode='play';break;
  case 'play':if(inp.pause){G.mode='pause';AU.sfx('blip');break}updPlay(dt);break;
  case 'pause':if(inp.pause||inp.start){G.mode='play';AU.sfx('blip')}break;
  case 'dying':G.stateT-=dt;P.vy+=900*dt;P.dy+=P.vy*dt;P.rot+=dt*9;if(G.stateT<=0){G.lives--;if(G.lives<=0)gameOver();else newRound()}break;
  case 'clear':G.stateT-=dt;updMira(dt,false);if(Math.random()<dt*6)burst(rnd(150,810),rnd(60,300),18,['#ff8fab','#ffe27a','#ffd0da'][Math.floor(Math.random()*3)],200,1,2.5,80);if(G.stateT<=0){G.level++;G.caught=0;buildLevel();newRound()}break;
 }
}

function drawActors(c){
 const t=G.t;
 drawGadgets(c,t);
 if(berry)drawBerry(c,berry,t);
 drawMira(c,M,t);
 if(mouseTarget&&G.mode==='play'){const y=FY[mouseTarget.f];c.strokeStyle='rgba(47,214,192,.7)';c.lineWidth=2;c.beginPath();c.ellipse(mouseTarget.x,y,12+Math.sin(t*8)*2,4,0,0,7);c.stroke()}
 for(const s of stars)drawStarItem(c,s,t);
 drawHag(c,t);
 drawClank(c,R,t);
 drawJuno(c,P,t);
 for(const w of wrenches){c.save();c.translate(w.x,w.y);c.rotate(w.rot);drawWrenchShape(c);c.restore()}
 for(const p of parts){const a=clamp(p.life/p.max,0,1);
  if(p.k==='spark'){c.save();c.globalCompositeOperation='lighter';c.globalAlpha=a;c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,p.size*(.5+a*.5),0,7);c.fill();c.restore()}
  else if(p.k==='smoke'){c.globalAlpha=a*.4;c.fillStyle='#6d6478';c.beginPath();c.arc(p.x,p.y,p.size,0,7);c.fill();c.globalAlpha=1}
  else{c.globalAlpha=a;text(c,p.s,p.x,p.y,15,UI+'','#fff','center',['rgba(10,6,30,.85)',4]);c.fillStyle=p.col;c.fillText(p.s,p.x,p.y);c.globalAlpha=1}}
 c.globalAlpha=1;
}

// ================= drawing: HUD & screens =================
function drawHUD(c,flat){
 const t=G.t;
 if(flat){const v=c.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.85);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');c.fillStyle=v;c.fillRect(0,0,W,H)}
 if(G.mode==='title'){drawTitle(c);return}
 const g=c.createLinearGradient(0,0,0,40);g.addColorStop(0,'rgba(8,5,25,.75)');g.addColorStop(1,'rgba(8,5,25,0)');c.fillStyle=g;c.fillRect(0,0,W,44);
 text(c,'SCORE',16,13,10,UI,'#a99cc9');text(c,String(G.score).padStart(6,'0'),16,30,18,DISP,'#fff');
 text(c,'ROUND '+(G.level+1)+' · '+LV.name.toUpperCase(),120,13,10,UI,'#a99cc9');
 // star goal
 const n=G.goal,sx=W/2-(n-1)*10,gy=H-14;if(LV.kind!=='street'){c.fillStyle='rgba(8,5,25,.45)';rr(c,sx-16,gy-12,(n-1)*20+32,24,12);c.fill();
 for(let i=0;i<n;i++){heartPath(c,sx+i*20,gy,6.5);c.fillStyle=i<G.caught?'#ff3b5c':'rgba(255,255,255,.16)';c.fill();if(i<G.caught)glow(c,sx+i*20,gy,12,'rgba(255,110,150,1)',.25)}}
 if(G.power>0){const w=180,x=W/2-w/2;c.fillStyle='rgba(255,255,255,.12)';rr(c,x,32,w,6,3);c.fill();c.fillStyle='#ffd36b';rr(c,x,32,w*G.power/6.5,6,3);c.fill();text(c,'PEAS POWER',W/2,22,10,UI,'#ffe29a','center')}
 text(c,'HI '+String(G.hi).padStart(6,'0'),W-16,13,10,UI,'#a99cc9','right');
 for(let i=0;i<G.lives;i++){const x=W-24-i*22,y=30;c.fillStyle='#f3c6a0';c.beginPath();c.arc(x,y,6,0,7);c.fill();c.beginPath();c.ellipse(x+4,y+3,4,3,0,0,7);c.fill();c.fillStyle='#f6f3ea';c.beginPath();c.arc(x,y-4,5.5,Math.PI,0);c.fill();c.fillRect(x-6.5,y-5,13,3);c.fillStyle='#b07a3e';c.fillRect(x+8,y-1,3,5)}
 const center=(a,b,sub)=>{c.fillStyle='rgba(8,5,25,.55)';c.fillRect(0,H/2-70,W,140);text(c,a,W/2,H/2-14,46,DISP,'#ffe27a','center',['#1a1033',8]);if(b)text(c,b,W/2,H/2+30,18,UI,'#f6ecff','center');if(sub)text(c,sub,W/2,H/2+54,13,UI,'#a99cc9','center')};
 if(G.mode==='ready')center('ROUND '+(G.level+1),'Catch '+G.goal+' of Olive\'s hearts. Ready, sailor!');
 if(G.mode==='pause')center('PAUSED','Press P, Start or click to resume','M toggles sound');
 if(G.mode==='dying'&&G.stateT<1.6)center('OUCH!',G.msg,G.lives>1?(G.lives-1)+' '+(G.lives-1===1?'life':'lives')+' left':'');
 if(G.mode==='clear')center('SHIP-SHAPE!',G.msg,'Next: '+LEVELS[(G.level+1)%3].name);
 if(G.mode==='over'){c.fillStyle='rgba(8,5,25,.7)';c.fillRect(0,0,W,H);text(c,'GAME OVER',W/2,H/2-40,58,DISP,'#ff8a6a','center',['#1a1033',9]);text(c,'Score '+G.score+(G.score>=G.hi&&G.score>0?'  ·  New best!':''),W/2,H/2+14,20,UI,'#fff','center');if(G.stateT<=0&&Math.floor(t*2)%2===0)text(c,VR.active?'Pull the trigger to play again':'Press Enter, click, or press A to play again',W/2,H/2+52,15,UI,'#ffe27a','center')}
}
function drawTitle(c){
 const t=G.t;c.fillStyle='rgba(8,5,25,.62)';c.fillRect(0,0,W,H);
 const y0=140,g=c.createLinearGradient(0,y0-40,0,y0+40);g.addColorStop(0,'#fff6d8');g.addColorStop(.5,'#ffd36b');g.addColorStop(1,'#ff8a5a');
 c.save();c.translate(W/2,y0);c.rotate(Math.sin(t*1.4)*.02);text(c,'SAILOR MAN',0,0,86,DISP,g,'center',['#141a3a',12]);c.restore();
 // rope underline
 c.strokeStyle='#d9c08a';c.lineWidth=4;c.setLineDash([7,5]);c.lineDashOffset=-t*20;c.beginPath();c.moveTo(W/2-250,y0+48);c.quadraticCurveTo(W/2,y0+66,W/2+250,y0+48);c.stroke();c.setLineDash([]);
 for(let i=0;i<5;i++){const a=t*.8+i*1.256,x=W/2+Math.cos(a)*330,y=y0+10+Math.sin(a)*44;heartPath(c,x,y,9);c.fillStyle='#ff3b5c';c.fill();glow(c,x,y,20,'rgba(255,110,150,1)',.35)}
 text(c,"Catch the hearts Olive tosses before they hit the ground. Dodge Captain Grudge and the Sea Hag's bottles.",W/2,y0+96,15,UI,'#f6ecff','center');
 text(c,"Eat a can of peas to flatten him. Punch the bag to drop a bucket on his head.",W/2,y0+116,15,UI,'#ffe29a','center');
 const rows=[['Keyboard','Arrows / WASD move & climb · Space or J punch · P pause · M sound'],['Mouse','Click a spot to walk there · right-click or click the sailor to punch'],['Gamepad','Stick or D-pad · A / X punch · Start pause'],['VR','Thumbstick move · trigger punch · B / Y pause']];
 rows.forEach(([k,v],i)=>{const y=y0+156+i*24;text(c,k.toUpperCase(),W/2-300,y,11,UI,'#ffc35a','left');text(c,v,W/2-210,y,14,UI,'#cfc3ea','left')});
 if(Math.floor(t*2)%2===0)text(c,VR.active?'PULL THE TRIGGER TO SET SAIL':'PRESS ENTER · CLICK · TAP PUNCH · Ⓐ',W/2,y0+270,18,DISP,'#ffe27a','center',['#141a3a',6]);
 if(G.hi>0)text(c,'BEST '+G.hi,W/2,y0+300,12,UI,'#a99cc9','center');
}
function render(L,layered){
 if(layered){for(const k in L){const c=L[k];c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,c.canvas.width,c.canvas.height);c.setTransform(VR.res,0,0,VR.res,0,0)}}
 drawSky(L.sky);drawFar(L.far);
 const sh=G.shake>0?G.shake*8:0,sx=(Math.random()-.5)*sh,sy=(Math.random()-.5)*sh;
 L.struct.save();L.struct.translate(sx,sy);drawStruct(L.struct);L.struct.restore();
 L.actors.save();L.actors.translate(sx,sy);drawActors(L.actors);L.actors.restore();
 drawHUD(L.hud,!layered);
}

// ================= VR =================
const VR={supported:false,active:false,session:null,prev:{},res:1.5,ctxs:null,texes:[],ready:false};
function loadThree(){return new Promise((res,rej)=>{if(window.THREE)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function checkVR(){
 try{if(navigator.xr&&await navigator.xr.isSessionSupported('immersive-vr')){VR.supported=true;bVR.hidden=false;bVR.disabled=true;bVR.textContent='Loading VR…';await loadThree();setupThree();bVR.disabled=false;bVR.textContent='Enter VR'}}catch(e){bVR.hidden=true}
}
function setupThree(){
 const T=window.THREE;const r=new T.WebGLRenderer({antialias:true});r.xr.enabled=true;r.xr.setReferenceSpaceType('local-floor');r.outputEncoding=T.sRGBEncoding;r.setSize(320,180);r.domElement.style.display='none';document.body.appendChild(r.domElement);
 const scene=new T.Scene();scene.background=new T.Color(0x05040f);scene.fog=new T.Fog(0x05040f,12,40);
 const cam=new T.PerspectiveCamera(70,16/9,.05,100);scene.add(cam);
 const defs=[['sky',9],['far',6.5],['struct',3.4],['actors',3.0],['hud',2.5]];VR.ctxs={};
 defs.forEach(([k,d],i)=>{const cvs=document.createElement('canvas');cvs.width=W*VR.res;cvs.height=H*VR.res;VR.ctxs[k]=cvs.getContext('2d');
  const tex=new T.CanvasTexture(cvs);tex.encoding=T.sRGBEncoding;tex.minFilter=T.LinearFilter;tex.generateMipmaps=false;VR.texes.push(tex);
  const w=d*1.25,h=w*9/16;const mat=new T.MeshBasicMaterial({map:tex,transparent:k!=='sky',depthWrite:k==='sky'});
  const mesh=new T.Mesh(new T.PlaneGeometry(w,h),mat);mesh.position.set(0,1.55,-d);mesh.renderOrder=i;scene.add(mesh)});
 // starfield around the player
 const n=900,pos=new Float32Array(n*3);for(let i=0;i<n;i++){const u=Math.random()*2-1,a=Math.random()*6.283,rad=14+Math.random()*16,s=Math.sqrt(1-u*u);pos[i*3]=Math.cos(a)*s*rad;pos[i*3+1]=Math.abs(u)*rad+1;pos[i*3+2]=Math.sin(a)*s*rad}
 const geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(pos,3));scene.add(new T.Points(geo,new T.PointsMaterial({color:0xfff1d0,size:.09,fog:false})));
 const floor=new T.Mesh(new T.CircleGeometry(4,48),new T.MeshBasicMaterial({color:0x1a1238,transparent:true,opacity:.8}));floor.rotation.x=-Math.PI/2;scene.add(floor);
 const ring=new T.Mesh(new T.RingGeometry(3.95,4.05,64),new T.MeshBasicMaterial({color:0xffc35a}));ring.rotation.x=-Math.PI/2;ring.position.y=.002;scene.add(ring);
 VR.renderer=r;VR.scene=scene;VR.camera=cam;VR.ready=true;
}
bVR.addEventListener('click',async()=>{
 AU.init();if(!VR.ready)return;
 if(VR.active){VR.session&&VR.session.end();return}
 try{
  const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});
  window.goatcounter&&goatcounter.count&&goatcounter.count({path:'vr'+location.pathname,title:'VR: '+document.title,event:true});
  VR.session=s;await VR.renderer.xr.setSession(s);VR.active=true;bVR.textContent='Exit VR';statusEl.textContent='Playing in VR';
  s.addEventListener('end',()=>{VR.active=false;VR.session=null;VR.renderer.setAnimationLoop(null);bVR.textContent='Enter VR';statusEl.textContent='Keyboard · Mouse · Touch · Gamepad · VR';last=performance.now();requestAnimationFrame(frame)});
  last=performance.now();VR.renderer.setAnimationLoop(()=>{const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;pollInput();update(dt);render(VR.ctxs,true);for(const tx of VR.texes)tx.needsUpdate=true;VR.renderer.render(VR.scene,VR.camera)});
  ctx.setTransform(SCALE,0,0,SCALE,0,0);ctx.fillStyle='#07061a';ctx.fillRect(0,0,W,H);text(ctx,'PLAYING IN VR',W/2,H/2,40,DISP,'#ffc35a','center');
 }catch(e){statusEl.textContent='VR could not start here. Try opening this page directly in your headset browser.'}
});

// ================= buttons =================
function toggleSound(){AU.init();AU.setOn(!AU.on);bSound.textContent=AU.on?'Sound on':'Sound off';bSound.setAttribute('aria-pressed',String(AU.on))}
bSound.addEventListener('click',toggleSound);
bFull.addEventListener('click',()=>{AU.init();if(document.fullscreenElement){document.exitFullscreen().catch(()=>{})}else if(stage.requestFullscreen){stage.requestFullscreen().catch(()=>{statusEl.textContent='Fullscreen is not available in this view'})}});

// ================= loop =================
let last=performance.now();
function frame(now){
 if(VR.active)return;
 const dt=Math.min(.05,(now-last)/1000);last=now;
 pollInput();update(dt);
 ctx.setTransform(SCALE,0,0,SCALE,0,0);
 const L={sky:ctx,far:ctx,struct:ctx,actors:ctx,hud:ctx};
 render(L,false);
 requestAnimationFrame(frame);
}
fit();buildLevel();newRound();G.mode='title';AU.pending='title';AU.mode='off';
if(document.fonts&&document.fonts.load){document.fonts.load('40px Bungee');document.fonts.load('600 16px Fredoka')}
requestAnimationFrame(frame);
checkVR();
})();
</script>
