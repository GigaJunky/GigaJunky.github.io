<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asteroids</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#05060d;--fg:#e8f0ff;--dim:#7d8aa8}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
canvas{background:#000;border:1px solid #223;max-width:100%;max-height:calc(100% - 90px);touch-action:none}
#hint{color:var(--dim);font-size:12px;margin-top:8px;text-align:center;padding:0 8px}
#pad{display:none;gap:8px;margin-top:8px}
#pad button{width:52px;height:48px;font-size:18px;background:#111a2e;color:var(--fg);border:1px solid #334;border-radius:8px;touch-action:none;user-select:none}
@media (pointer:coarse){#pad{display:flex}#hint{display:none}}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<div id="hint">← → rotate · ↑ thrust · Space fire · ↓/X shield · H/Z warp · M mute · Enter start</div>
<div id="pad">
<button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button>
<button data-k="ArrowUp">▲</button><button data-k="Space">●</button><button data-k="ArrowDown">🛡</button><button data-k="KeyH">🌀</button>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
const keys={};
addEventListener('keydown',e=>{initAudio();if(e.code==='KeyM'&&master){muted=!muted;master.gain.value=muted?0:.4;}keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='Enter'&&state!=='play')start();});
addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('#pad button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();keys[k]=true;if(state!=='play')start();});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>keys[k]=false));
});
cv.addEventListener('pointerdown',()=>{initAudio();if(state!=='play')start();});

let AC,master,thrustG,noiseBuf,muted=false;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:.4;master.connect(AC.destination);
    const len=AC.sampleRate,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    noiseBuf=buf;
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=300;
    thrustG=AC.createGain();thrustG.gain.value=0;
    src.connect(f);f.connect(thrustG);thrustG.connect(master);src.start();
  }catch(e){AC=null;}
}
function tone(f0,f1,dur,type='square',vol=.2,delay=0){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur);
}
function noise(dur,vol,freq){
  if(!AC)return;
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;
  s.buffer=noiseBuf;f.type='lowpass';f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(60,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur);
}

let ship,rocks,bullets,parts,score,lives,level,state='title',cool=0,inv=0,best=0;
const R=(a,b)=>Math.random()*(b-a)+a;
const wrap=o=>{o.x=(o.x+W)%W;o.y=(o.y+H)%H;};

function makeRock(x,y,size){
  const a=R(0,6.28),sp=R(.6,1.6)*(4-size)*.6+.4,n=10;
  const r=size*14,shape=[];
  for(let i=0;i<n;i++)shape.push(r*R(.75,1.25));
  return{x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,size,r,shape,rot:R(0,6.28),vr:R(-.03,.03)};
}
function spawnLevel(){
  rocks=[];
  for(let i=0;i<3+level;i++){
    let x,y;do{x=R(0,W);y=R(0,H);}while(Math.hypot(x-W/2,y-H/2)<160);
    rocks.push(makeRock(x,y,3));
  }
}
function resetShip(){ship={x:W/2,y:H/2,vx:0,vy:0,a:-Math.PI/2};inv=120;}
function start(){en=100;shLock=false;warpCd=0;mult=1;multT=0;shake=0;ripples.length=0;score=0;lives=3;level=1;bullets=[];parts=[];resetShip();spawnLevel();state='play';}
const COL=[0,'#3dff8a','#ffb02e','#ff3ea5'];
parts=[];rocks=[];bullets=[];
let shake=0,mult=1,multT=0;const ripples=[];
function ripple(x,y,str){ripples.push({x,y,str,t:0});if(ripples.length>12)ripples.shift();}
function boom(x,y,n,c='#ffffff',str=0){
  for(let i=0;i<n;i++){const a=R(0,6.28),s=R(.5,4.5);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:R(25,55),c});}
  if(str){ripple(x,y,str);shake=Math.min(14,shake+str*.12);}
}

let en=100,shOn=false,warpCd=0,warpHeld=false,padHeld=false,gpOn=false,gpBlocked=false,shLock=false;
const inp={turn:0,t:0,f:0,s:0,w:0};
addEventListener('gamepadconnected',()=>{document.getElementById('hint').textContent='Gamepad: stick steer/thrust · A fire · LT/LB shield · B warp · Start begins';});
function poll(){
  const k=keys;
  let turn=(k.ArrowRight?1:0)-(k.ArrowLeft?1:0),t=k.ArrowUp,f=k.Space,s=k.ArrowDown||k.KeyX,w=k.KeyH||k.KeyZ,st=false;
  let g=null;
  if(!gpBlocked&&navigator.getGamepads){try{g=[...navigator.getGamepads()].find(x=>x&&x.connected)||null;}catch(e){gpBlocked=true;}}
  if(g){
    const b=i=>!!(g.buttons[i]&&g.buttons[i].pressed),ax=g.axes[0]||0,ay=g.axes[1]||0;
    if(Math.abs(ax)>.2)turn=ax;
    if(b(14))turn=-1;if(b(15))turn=1;
    t=t||b(7)||b(12)||ay<-.5;
    f=f||b(0)||b(2)||b(5);
    s=s||b(4)||b(6)||b(13)||ay>.5;
    w=w||b(1)||b(3);
    st=b(9)||b(0);
  }
  inp.turn=turn;inp.t=!!t;inp.f=!!f;inp.s=!!s;inp.w=!!w;
  if(st&&!padHeld&&state!=='play'){initAudio();start();}
  padHeld=st;
}
function warp(){
  if(warpCd>0)return;
  boom(ship.x,ship.y,14,'#c58cff',40);
  ship.x=R(40,W-40);ship.y=R(40,H-40);ship.vx*=.3;ship.vy*=.3;
  inv=45;warpCd=120;
  boom(ship.x,ship.y,14,'#c58cff',40);
  tone(1200,200,.25,'sine',.2);tone(200,1200,.25,'sine',.2,.12);
}
function update(){
  poll();
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.vy*=.98;p.life--;});
  parts=parts.filter(p=>p.life>0);
  ripples.forEach(r=>r.t++);while(ripples.length&&ripples[0].t>70)ripples.shift();
  shake*=.9;
  if(thrustG)thrustG.gain.setTargetAtTime(inp.t&&state==='play'?.25:0,AC.currentTime,.05);
  if(state!=='play')return;
  if(en<=0)shLock=true;else if(en>=25)shLock=false;
  shOn=inp.s&&!shLock;
  en=shOn?Math.max(0,en-.6):Math.min(100,en+.25);
  if(warpCd>0)warpCd--;
  if(multT>0&&--multT===0)mult=1;
  if(inp.w&&!warpHeld)warp();
  warpHeld=inp.w;
  ship.a+=inp.turn*.075;
  if(inp.t){ship.vx+=Math.cos(ship.a)*.12;ship.vy+=Math.sin(ship.a)*.12;
    for(let i=0;i<2;i++)parts.push({x:ship.x-Math.cos(ship.a)*10,y:ship.y-Math.sin(ship.a)*10,vx:-Math.cos(ship.a)*R(1,3)+R(-.5,.5)+ship.vx*.5,vy:-Math.sin(ship.a)*R(1,3)+R(-.5,.5)+ship.vy*.5,life:R(10,22),c:Math.random()<.5?'#ffb347':'#ff5a3d'});}
  ship.vx*=.99;ship.vy*=.99;
  ship.x+=ship.vx;ship.y+=ship.vy;wrap(ship);
  if(cool>0)cool--;
  if(inv>0)inv--;
  if(inp.f&&cool===0&&!shOn&&bullets.length<6){
    bullets.push({x:ship.x+Math.cos(ship.a)*14,y:ship.y+Math.sin(ship.a)*14,vx:Math.cos(ship.a)*7+ship.vx,vy:Math.sin(ship.a)*7+ship.vy,life:55});
    cool=10;tone(900,180,.12,'square',.12);
  }
  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;wrap(b);});
  bullets=bullets.filter(b=>b.life>0);
  rocks.forEach(r=>{r.x+=r.vx;r.y+=r.vy;r.rot+=r.vr;wrap(r);});

  for(const b of bullets){
    for(let i=rocks.length-1;i>=0;i--){
      const r=rocks[i];
      if(Math.hypot(b.x-r.x,b.y-r.y)<r.r){
        b.life=0;rocks.splice(i,1);
        score+=[0,100,50,20][r.size]*mult;mult=Math.min(10,mult+1);multT=110;
        boom(r.x,r.y,10+r.size*6,COL[r.size],r.size*22);noise(.15+r.size*.12,.35,[0,2500,1500,900][r.size]);
        if(r.size>1){rocks.push(makeRock(r.x,r.y,r.size-1),makeRock(r.x,r.y,r.size-1));}
        break;
      }
    }
  }
  if(shOn||inv===0){
    for(const r of rocks){
      const d=Math.hypot(ship.x-r.x,ship.y-r.y);
      if(shOn&&d<r.r+22){
        const nx=(r.x-ship.x)/(d||1),ny=(r.y-ship.y)/(d||1),sp=Math.min(4,Math.hypot(r.vx,r.vy)+.8);
        r.vx=nx*sp;r.vy=ny*sp;ship.vx-=nx*.6;ship.vy-=ny*.6;
        r.x=ship.x+nx*(r.r+23);r.y=ship.y+ny*(r.r+23);
        en=Math.max(0,en-10);tone(180,320,.1,'sine',.25);
        continue;
      }
      if(inv===0&&d<r.r*.9+8){
        boom(ship.x,ship.y,60,'#7df9ff',90);lives--;mult=1;noise(.9,.6,1800);tone(260,35,.7,'sawtooth',.25);
        if(lives<=0){tone(200,50,1.2,'sawtooth',.25,.4);state='over';best=Math.max(best,score);}
        else resetShip();
        break;
      }
    }
  }
  if(rocks.length===0){tone(440,440,.12,'triangle',.25);tone(660,660,.12,'triangle',.25,.12);tone(880,880,.2,'triangle',.25,.24);level++;spawnLevel();inv=90;}
}

function text(t,x,y,sz,al='center',c='#e8f0ff'){ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=sz>30?24:8;ctx.font=sz+'px ui-monospace,Menlo,Consolas,monospace';ctx.textAlign=al;ctx.fillText(t,x,y);ctx.shadowBlur=0;}
function neon(c,b){ctx.strokeStyle=c;ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=b;}
function warpPt(x,y){
  let dx=0,dy=0;
  for(const r of ripples){
    const ex=x-r.x,ey=y-r.y,d=Math.hypot(ex,ey)||1,k=(d-r.t*7)/45;
    const f=r.str*Math.exp(-k*k)*(1-r.t/70)*.5;
    dx+=ex/d*f;dy+=ey/d*f;
  }
  return[x+dx,y+dy];
}
function grid(){
  ctx.lineWidth=1;ctx.strokeStyle='#2233a0';ctx.shadowBlur=0;ctx.globalAlpha=.55;ctx.beginPath();
  const S=40,st=10;
  for(let x=0;x<=W;x+=S)for(let y=0;y<=H;y+=st){const[p,q]=warpPt(x,y);y?ctx.lineTo(p,q):ctx.moveTo(p,q);}
  for(let y=0;y<=H;y+=S)for(let x=0;x<=W;x+=st){const[p,q]=warpPt(x,y);x?ctx.lineTo(p,q):ctx.moveTo(p,q);}
  ctx.stroke();ctx.globalAlpha=1;
}
function draw(){
  ctx.fillStyle='#02030a';ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>.3)ctx.translate(R(-shake,shake),R(-shake,shake));
  grid();
  ctx.lineJoin='round';ctx.lineWidth=2;
  if(state!=='title'){
    rocks.forEach(r=>{
      neon(COL[r.size],14);
      ctx.beginPath();
      r.shape.forEach((d,i)=>{const a=r.rot+i/r.shape.length*6.283;const x=r.x+Math.cos(a)*d,y=r.y+Math.sin(a)*d;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
      ctx.closePath();ctx.stroke();
    });
    ctx.globalCompositeOperation='lighter';
    parts.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life/30);ctx.strokeStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=6;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2.5,p.y-p.vy*2.5);ctx.stroke();});
    ctx.globalAlpha=1;
    neon('#fff6a8',12);ctx.lineWidth=3;
    bullets.forEach(b=>{ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*1.6,b.y-b.vy*1.6);ctx.stroke();});
    ctx.globalCompositeOperation='source-over';ctx.lineWidth=2;
    if(state==='play'&&(inv===0||Math.floor(inv/6)%2===0)){
      ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.a);
      neon('#7df9ff',16);
      ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-10,-9);ctx.lineTo(-5,0);ctx.lineTo(-10,9);ctx.closePath();ctx.stroke();
      ctx.restore();
    }
    if(state==='play'&&shOn){neon('#5ce1ff',20);ctx.globalAlpha=.4+.6*en/100;ctx.beginPath();ctx.arc(ship.x,ship.y,20,0,6.283);ctx.stroke();ctx.globalAlpha=1;}
  }
  ctx.shadowBlur=0;ctx.restore();
  if(state!=='title'){
    ctx.lineWidth=1;ctx.strokeStyle='#5ce1ff';ctx.strokeRect(16,40,100,8);ctx.fillStyle=(en<25||shLock)?'#ff6b6b':'#5ce1ff';ctx.fillRect(16,40,en,8);
    text('SHIELD',122,48,11,'left','#7d8aa8');
    text('WARP '+(warpCd>0?'···':'READY'),16,68,12,'left','#7d8aa8');
    text('SCORE '+score,16,28,18,'left','#7df9ff');
    text('LEVEL '+level,W/2,28,18,'center','#c58cff');
    if(mult>1)text('×'+mult,W/2,56,22,'center','#ffe14d');
    text('SHIPS '+'▲'.repeat(Math.max(lives,0)),W-16,28,18,'right','#7df9ff');
  }
  if(state==='title'){
    text('ASTEROIDS',W/2,H/2-20,56,'center','#7df9ff');
    text('Press Enter or tap to start',W/2,H/2+30,18,'center','#c58cff');
  }
  if(state==='over'){
    text('GAME OVER',W/2,H/2-20,52,'center','#ff3ea5');
    text('Score '+score+'  ·  Best '+best,W/2,H/2+25,20,'center','#ffe14d');
    text('Press Enter or tap to play again',W/2,H/2+60,16,'center','#7d8aa8');
  }
}
(function loop(){requestAnimationFrame(loop);try{update();draw();}catch(e){console.error(e);}})();
</script>
</body>
</html>
