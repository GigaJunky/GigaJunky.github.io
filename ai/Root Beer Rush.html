<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one upright arcade cabinet, marquee over CRT bezel over control deck; single dark look by choice */
:root{
  --ink:#120a06; --cab:#2a160c; --cab-hi:#43251a; --copper:#d07a3c; --brass:#e3b955;
  --foam:#f6e7c8; --teal:#46c7b5; --red:#d9483a; --muted:#b8977a;
  --f-marq:"Rye", "Rockwell", Georgia, serif;
  --f-px:"Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-term:"Nunito", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{overflow:hidden}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--ink);--tp:0px}
#app.touchon{--tp:136px}
#app:fullscreen{padding-block:0}
#app .screen{width:min(100%, calc((100dvh - 20px - var(--tp)) * 1.6));flex:none;border-radius:6px;box-shadow:0 0 0 2px #2a1a10,0 20px 50px rgba(0,0,0,.6)}
#app:fullscreen .screen{width:min(100%, calc((100vh - var(--tp)) * 1.6));border-radius:0;box-shadow:none}
.bar{position:absolute;top:8px;right:8px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:75%}
.bar button{font-family:var(--f-px);font-size:13px;letter-spacing:.03em;line-height:1;padding:7px 8px;background:rgba(18,10,6,.82);color:var(--foam);border:1px solid var(--copper);border-radius:4px;cursor:pointer}
.bar button.on{background:var(--copper);color:#1a0b05}
.bar button:hover{border-color:var(--brass)}
.bar button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}
body{background:radial-gradient(120% 80% at 50% 0%, #2a150b 0%, var(--ink) 60%) fixed, var(--ink);color:var(--foam);font-family:var(--f-term);font-size:18px;}
.wrap{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;padding-block:14px 24px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));}
.cab{width:min(980px, 100%, max(320px, calc((100dvh - 250px) * 1.6 + 36px)));box-sizing:border-box;background:linear-gradient(180deg,var(--cab-hi),var(--cab) 30%,#1c0e07);border:2px solid #5c3420;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 0 4px #0a0503, 0 30px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,210,160,.15)}
.marquee{position:relative;border-radius:10px;padding:10px 16px 12px;text-align:center;overflow:hidden;background:radial-gradient(90% 140% at 50% 120%, #ffb35c 0%, #c25a22 35%, #5a200c 75%, #2a0d05 100%);border:2px solid #1a0b05;box-shadow:inset 0 0 24px rgba(0,0,0,.55), 0 0 26px rgba(255,150,70,.25)}
.marquee .maker{font-family:var(--f-px);font-size:9px;letter-spacing:.3em;color:#ffe0a8;text-shadow:0 1px 0 #3a1306}
.marquee h1{margin:4px 0 0;font-family:var(--f-marq);font-weight:400;font-size:clamp(28px,6vw,52px);line-height:1;color:var(--foam);text-wrap:balance;text-shadow:0 2px 0 #7a2e10,0 4px 0 #4a1a08,0 6px 12px rgba(0,0,0,.5)}
.marquee .bub{position:absolute;border-radius:50%;background:rgba(255,240,210,.35);animation:rise 6s linear infinite}
@keyframes rise{from{transform:translateY(40px);opacity:0}20%{opacity:1}to{transform:translateY(-90px);opacity:0}}
.bezel{background:#050302;border-radius:12px;padding:10px;box-shadow:inset 0 0 0 2px #2a1a10, inset 0 0 30px #000}
.screen{position:relative;width:100%;aspect-ratio:8/5;max-width:100%;border-radius:10px;overflow:hidden;background:#000;touch-action:none}
#game{display:block;width:100%;height:100%;filter:saturate(1.08) contrast(1.04);touch-action:none;cursor:pointer}
#bloom{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:blur(6px) brightness(1.2) saturate(1.3);opacity:.32;mix-blend-mode:screen}
.scan::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,0) 35%);border-radius:10px}
#view3d{position:absolute;inset:0;touch-action:none}
#view3d canvas{display:block;width:100%!important;height:100%!important}

.scan::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%, rgba(255,220,180,.06), rgba(0,0,0,0) 60%)}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:90%;background:rgba(18,10,6,.92);color:var(--foam);border:1px solid var(--copper);border-radius:6px;padding:6px 10px;font-family:var(--f-term);font-size:18px;text-align:center;pointer-events:none}
.deck{display:flex;flex-wrap:wrap;gap:10px 14px;justify-content:center;align-items:flex-start;padding:4px 4px 2px;background:linear-gradient(180deg,#1d0f08,#2c170d);border-radius:10px;border-top:2px solid #5c3420;padding-block:12px}
.ab{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--muted);font-family:var(--f-px);font-size:8px;letter-spacing:.08em;cursor:pointer}
.ab i{display:block;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%, var(--hi), var(--base) 55%, var(--lo));box-shadow:0 5px 0 var(--lo), 0 7px 10px rgba(0,0,0,.5), inset 0 -3px 6px rgba(0,0,0,.35);transition:transform .06s, box-shadow .06s}
.ab:active i,.ab.on i{transform:translateY(3px);box-shadow:0 2px 0 var(--lo), 0 3px 6px rgba(0,0,0,.5), inset 0 -3px 6px rgba(0,0,0,.35)}
.ab.on{color:var(--foam)}
.ab:disabled{opacity:.45;cursor:not-allowed}
.ab:focus-visible{outline:2px solid var(--teal);outline-offset:4px;border-radius:8px}
.b-brass{--hi:#fff0b0;--base:#e3b955;--lo:#8a6a1e}
.b-red{--hi:#ffb0a0;--base:#d9483a;--lo:#7a1e14}
.b-teal{--hi:#c8fff4;--base:#46c7b5;--lo:#1a6a5e}
.b-cream{--hi:#ffffff;--base:#e9dcc0;--lo:#8a7a5e}
.touch{display:none;justify-content:space-between;align-items:center;gap:12px;padding-inline:6px;user-select:none;-webkit-user-select:none}
.touch.show{display:flex}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
.tb{display:flex;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(#4a2a18,#2a160c);border:2px solid #6a3c22;color:var(--foam);font-family:var(--f-px);font-size:14px;touch-action:none}
.tb.down{background:linear-gradient(#6a3c22,#4a2a18)}
.pour{width:110px;height:110px;border-radius:50%;font-size:12px;background:radial-gradient(circle at 35% 30%,#ffb0a0,#d9483a 55%,#7a1e14);border:3px solid #3a0e08;box-shadow:0 6px 0 #5a140c}
.pour.down{transform:translateY(4px);box-shadow:0 2px 0 #5a140c}
.mid{display:flex;flex-direction:column;gap:8px}
.mid .tb{padding:10px 12px;font-size:9px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 16px;padding:2px 6px 4px;color:var(--muted);font-size:18px;line-height:1.15}
.legend b{display:block;font-family:var(--f-px);font-size:8px;letter-spacing:.12em;color:var(--brass);font-weight:400;margin-bottom:3px}
.legend div{min-width:0}
.foot{margin-top:10px;color:#7a5e48;font-size:16px;text-align:center;max-width:65ch}
@media (prefers-reduced-motion:reduce){.marquee .bub{animation:none;display:none}}
</style>

<div id="app">
  <div class="screen" id="screen">

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ================= CONSTANTS ================= */
const W=384,H=240,ROWS=4;
const RT=i=>26+i*53;
const L=[44,32,20,32], R=324, TAPX=338;
const cv=document.getElementById('game'); const cx=cv.getContext('2d');
const F_T='"Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif';
const F_U='"Nunito", system-ui, sans-serif';
let K=3; // device pixels per logical pixel
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c};
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU=Math.PI*2;
let NID=1;
function srand(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---- vector helpers (all in logical units) ---- */
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function ell(g,x,y,rx,ry,rot=0){g.beginPath();g.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot,0,TAU)}
function LG(g,x0,y0,x1,y1,st){const gr=g.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,c])=>gr.addColorStop(o,c));return gr}
function RG(g,x,y,r0,x1,y1,r1,st){const gr=g.createRadialGradient(x,y,r0,x1,y1,r1);st.forEach(([o,c])=>gr.addColorStop(o,c));return gr}
const shade=(hex,f)=>{const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;if(f>1){r=r+(255-r)*(f-1);g=g+(255-g)*(f-1);b=b+(255-b)*(f-1)}else{r*=f;g*=f;b*=f}return'#'+((1<<24)|(clamp(Math.round(r),0,255)<<16)|(clamp(Math.round(g),0,255)<<8)|clamp(Math.round(b),0,255)).toString(16).slice(1)};
const OL='rgba(34,14,6,.88)';
function fs(g,fill,lw=.42,stroke=OL){g.fillStyle=fill;g.fill();if(lw){g.lineWidth=lw;g.strokeStyle=stroke;g.stroke()}}
function txt(g,s,x,y,col='#fff',align='left',size=8,stroke='rgba(24,10,4,.92)',kind='t'){
  g.font=kind==='u'?`900 ${size}px ${F_U}`:`${size}px ${F_T}`;g.textAlign=align;g.textBaseline='top';
  if(stroke){g.lineJoin='round';g.lineWidth=Math.max(.6,size*.24);g.strokeStyle=stroke;g.strokeText(s,x,y)}
  g.fillStyle=col;g.fillText(s,x,y);
}
function glow(g,col,blur){g.shadowColor=col;g.shadowBlur=blur*K}
function noGlow(g){g.shadowBlur=0;g.shadowColor='transparent'}

/* ================= THEMES ================= */
const SKINS=['#f6d2b0','#ecbf98','#d49a6e','#b47a50','#8a5636','#62402a'];
const ALIEN=['#8fd16a','#6fc8bc','#b48fe0','#e8a0c8'];
const HAIRS=['#2a1a10','#5a2e14','#a8642c','#e8c878','#c8c8c8','#141414'];
const PUNK=['#ff3b8d','#3bf0ff','#b4ff3b','#ffb000'];
const SHIRTS=['#c0392b','#2e74b5','#2e9e5a','#8e44ad','#e08a1a','#16a085','#e8e0d0','#34495e','#e06aa0'];
const PANTS=['#2a2a3a','#3a2a1a','#1e3a5a','#4a3a2a'];
const ACC=['#c0392b','#1f5fbf','#7a2ab0','#1e8a4a','#e0a020'];
const THEMES=[
  {name:'DUSTY GULCH SALOON',wall:'saloon',types:['cowboy','cowboy','prospector','beehive','detective','hero','fox','bulldog','rocker'],hats:['#6a4426','#2b2018','#d9c8a0','#8a2a1a'],floor:['#5a3a22','#3e2616'],door:'#a8733c',tr:0,seed:11},
  {name:'BIG LEAGUE BALLPARK',wall:'ballpark',types:['cap','cap','beehive','hero','hero','surfer','bulldog','rocker','villain'],hats:['#c0392b','#1f4fa0','#1e7a3a','#222222'],floor:['#6a5236','#4e3c26'],door:'#e8e0c8',tr:2,seed:23},
  {name:'SEASIDE BOARDWALK',wall:'boardwalk',types:['mohawk','surfer','pirate','beehive','frog','frog','rocker','fox','villain'],hats:['#f2ece0','#2fa8c8','#e85a8a'],floor:['#b89064','#9a7448'],door:'#2f7fa8',tr:5,seed:37},
  {name:'TRANQUILITY MOON BASE',wall:'moon',types:['dome','dome','robot','astro','hero','villain','rocker','frog'],hats:['#c8d0e0','#a0a8c0'],floor:['#3a4058','#262a3c'],door:'#8a98b8',tr:-2,seed:51},
];

/* ================= CHARACTER ART ================= */
function drawMug(g,x,y,fill,t,jig,seed=0){
  g.save();g.lineJoin='round';g.lineCap='round';
  // shadow-free glass body x..x+6, y+.4..y+9
  rr(g,x+.55,y+1,4.9,7.6,1);g.save();g.clip();
  g.fillStyle='rgba(190,225,238,.20)';g.fillRect(x,y,6,9);
  if(fill>0){const f=Math.min(1,fill),top=y+8.6-7.4*f;
    g.fillStyle=LG(g,0,top,0,y+8.6,[[0,'#b0642c'],[.18,'#6a2c0c'],[1,'#2e1004']]);g.fillRect(x,top,6,y+9-top);
    g.fillStyle='rgba(255,220,170,.55)';for(let k=0;k<4;k++){const by=y+8.4-((t*6+k*.37+seed*.13)%1)*(y+8.6-top);ell(g,x+1.4+k*1.05,by,.22,.22);g.fill()}}
  g.restore();
  rr(g,x,y+.4,6,8.6,1.3);g.fillStyle='rgba(225,244,250,.10)';g.fill();g.lineWidth=.5;g.strokeStyle='rgba(235,250,255,.9)';g.stroke();
  rr(g,x+.3,y+7.9,5.4,1,.5);g.fillStyle='rgba(220,240,250,.45)';g.fill();
  g.beginPath();g.ellipse(x+6.1,y+4.6,1.6,2,0,-1.45,1.45);g.lineWidth=.85;g.strokeStyle='rgba(235,250,255,.85)';g.stroke();
  if(fill>=1){const wob=jig?Math.sin(t*28+seed)*.45*jig:0;
    const fg=LG(g,0,y-1.6,0,y+1.6,[[0,'#ffffff'],[.6,'#fff0d0'],[1,'#e8c890']]);
    g.fillStyle=fg;g.beginPath();g.moveTo(x-.1+wob,y+1.4);
    for(let k=0;k<=4;k++){const bx=x+.4+k*1.3+wob,by=y-.2-Math.abs(Math.sin(t*22*Math.max(jig,.15)+k*1.7+seed))*.7*Math.max(jig,.3);g.quadraticCurveTo(bx-.65,by-.9,bx,by)}
    g.lineTo(x+6.1+wob,y+1.4);g.closePath();g.fill();g.lineWidth=.3;g.strokeStyle='rgba(200,170,120,.6)';g.stroke();
    if(jig>0){const dl=1.2+((Math.sin(t*5+seed)+1)*1.4);ell(g,x+.1+wob,y+1.2+dl/2,.38,dl/2);g.fillStyle='#fff3dc';g.fill()}
    ell(g,x+1.8+wob,y-.2,.8,.35);g.fillStyle='rgba(255,255,255,.9)';g.fill();}
  else if(fill<=0){g.fillStyle='rgba(250,236,205,.75)';ell(g,x+3,y+8,2,.5);g.fill();ell(g,x+1.4,y+3,.5,.3);g.fill();ell(g,x+4,y+5,.4,.3);g.fill()}
  g.beginPath();g.moveTo(x+1.1,y+2.1);g.lineTo(x+1.1,y+7);g.lineWidth=.55;g.strokeStyle='rgba(255,255,255,.75)';g.stroke();
  g.beginPath();g.moveTo(x+4.6,y+2.5);g.lineTo(x+4.6,y+4);g.lineWidth=.35;g.strokeStyle='rgba(255,255,255,.45)';g.stroke();
  g.restore();
}
function limb(g,x0,y0,x1,y1,sleeve,skin,lw=1.7){
  const mx=lerp(x0,x1,.55),my=lerp(y0,y1,.55);g.lineCap='round';
  g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.lineWidth=lw+.8;g.strokeStyle=OL;g.stroke();
  g.beginPath();g.moveTo(mx,my);g.lineTo(x1,y1);g.lineWidth=lw*.8;g.strokeStyle=skin;g.stroke();
  g.beginPath();g.moveTo(x0,y0);g.lineTo(mx,my);g.lineWidth=lw;g.strokeStyle=sleeve;g.stroke();
  ell(g,x1,y1,.95,.95);fs(g,skin,.35);
}
function headShade(g,x,y,r,skin){return RG(g,x-r*.35,y-r*.45,r*.15,x,y,r*1.05,[[0,shade(skin,1.18)],[.6,skin],[1,shade(skin,.78)]])}
function face(g,c,angry,opts={}){
  const skin=angry?'#e8704e':c.skin;
  // ear
  ell(g,7.1,7.4,.95,1.15);fs(g,shade(skin,.86),.35);
  // nose
  ell(g,12.55,7.55,opts.bigNose?1.35:1.0,opts.bigNose?1.1:.85);fs(g,opts.bigNose?'#e88a70':shade(skin,1.05),.35);
  if(!opts.noEyes){
    ell(g,10.55,6.15,.95,1.1);fs(g,'#ffffff',.3);ell(g,10.95,6.3,.55,.68);g.fillStyle='#1c120c';g.fill();ell(g,11.1,6.05,.18,.18);g.fillStyle='#fff';g.fill();
    g.beginPath();if(angry){g.moveTo(9.7,4.6);g.lineTo(11.6,5.4)}else{g.moveTo(9.7,4.95);g.quadraticCurveTo(10.6,4.4,11.5,4.8)}g.lineWidth=.45;g.strokeStyle='#2a160c';g.stroke();
  }
  if(angry){ell(g,11.2,9.3,1.05,.85);fs(g,'#3a0808',.3)}
  else if(!opts.noMouth){g.beginPath();g.moveTo(10.3,9.0);g.quadraticCurveTo(11.1,9.6,11.9,8.9);g.lineWidth=.42;g.strokeStyle='#5a2214';g.stroke()}
  ell(g,10.1,8.2,.9,.5);g.fillStyle='rgba(235,90,90,.22)';g.fill();
}
function drawCustomer(g,c,frame){
  const angry=frame==='angry',type=c.type,metal=type==='robot',suit=type==='astro';
  const skin=metal?'#b8c0cc':angry?'#e8704e':c.skin;
  const shirt=suit?'#eef0f4':type==='detective'?'#b8925a':type==='rocker'?'#1c1a22':type==='villain'?'#f2f4f0':c.shirt;
  g.lineJoin='round';g.lineCap='round';
  const A={walk0:[[5,12.6,4.3,17.4],[11.6,12.6,12.3,17.4]],walk1:[[5,12.6,5.8,17.2],[11.6,12.6,13.4,16.8]],hold:[[5,12.6,4.4,17.4],[11.6,12.6,15.6,14.4]],drink:[[5,12.6,4.4,17.4],[11.6,12.6,13.2,9.4]],angry:[[5,12.6,2,6],[11.6,12.6,14.8,6]]}[frame];

function update(dt){

  for(let i=0;i<ROWS;i++)G.doors[i]=Math.max(0,G.doors[i]-dt*1.3);
  for(const p of G.parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}G.parts=G.parts.filter(p=>p.life>0);
  for(const p of G.pops)p.t+=dt;G.pops=G.pops.filter(p=>p.t<.9);
  if(G.paused)return;
  switch(G.state){
    case'attract':if(ED.fire)startPress();break;
    case'ready':if(G.t>2.4){G.state='play';G.t=0;musicStart('main')}break;
    case'play':{const n=Math.ceil(dt/(1/120)),h=dt/n;for(let k=0;k<n&&G.state==='play';k++)playStep2(h);break}
    case'death':if(G.t>.55&&!G.jl){G.jl=true;jingle('lose')}
      if(G.t>3.3){G.lives--;if(G.lives<=0)gameOver();else{G.toSpawn+=G.customers.length;resetRound()}}break;
    case'clear':if(G.t>3.4){add(G.clearBonus);startBonus()}break;
    case'bonus':updateBonus(dt);break;
    case'gameover':if(ED.fire&&G.t>1.5)G.t=99;if(G.t>5){if(qualifies(G.score)){G.state='initials';G.t=0;G.I={l:[0,0,0],pos:0};jingle('hiscore')}else toAttract()}break;
    case'initials':if(ED.up)initStep(1);if(ED.down)initStep(-1);if(ED.fire||ED.right)initAdvance();if(ED.left&&G.I.pos>0){G.I.pos--;sfx('move')}if(G.t>40)saveInitials();break;
  }
}

  updateBartender(dt);
