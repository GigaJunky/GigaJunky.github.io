<html lang="en"><head><meta charset="utf-8">

</style></head><body>
<canvas id="c" width="480" height="720"></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=480,H=720;
let S='title',score=0,hi=0,wave=0,lives=3,geoms=0,chain=0,chainT=0,shake=0,time=0,banner=0,shotT=1;
let P,en=[],pb=[],eb=[],pt=[],pu=[],ge=[],stars=[],grid=[];

const R=Math.random,TAU=Math.PI*2;
try{hi=+localStorage.getItem('geo_hi')||0}catch(e){}

const GC=17,GR=23,GX=W/(GC-1),GY=H/(GR-1);
for(let r=0;r<GR;r++)for(let c=0;c<GC;c++)grid.push({ox:c*GX,oy:r*GY,x:c*GX,y:r*GY,vx:0,vy:0});
function push(x,y,r,f){for(const p of grid){const dx=p.x-x,dy=p.y-y,d=Math.hypot(dx,dy);if(d<r&&d>1){const k=f*(1-d/r);p.vx+=dx/d*k;p.vy+=dy/d*k}}}
let gpx=0,gpfire=false,gpPrev=false,vs=null,vf=new Set();
function pollPad(){let gs=[];try{gs=navigator.getGamepads?navigator.getGamepads():[]}catch(e){}gpx=0;gpfire=false;let st=false;
for(const p of gs){if(!p)continue;let x=p.axes[0]||0;if(Math.abs(x)<.15)x=0;
if(p.buttons[14]&&p.buttons[14].pressed)x=-1;if(p.buttons[15]&&p.buttons[15].pressed)x=1;if(x)gpx=x;
for(const i of [0,1,2,3,5,7])if(p.buttons[i]&&p.buttons[i].pressed)gpfire=true;
if(p.buttons[9]&&p.buttons[9].pressed)st=true}
const any=gpfire||st;if(any&&!gpPrev&&S!='play')start();gpPrev=any;
if(vs)gpx=Math.max(-1,Math.min(1,(vs.x-vs.bx)/45));if(vf.size)gpfire=true}
let bonus=false,bHits=0,bTotal=0,bRate=.3,msg='',msgT=0,rs=[];
const BS=[1,-1,1,-1,1],BF=[14,14,7.5,7.5,6],BA=[170,170,190,190,200];
function over(){S='over';if(score>hi){hi=score;try{localStorage.setItem('geo_hi',hi)}catch(e){}}}
function beamOn(e){return e.s==3&&e.bt>.4&&(e.bt<4.2||(P.capt&&P.capt.e===e))}
function capBusy(e){return en.some(q=>q!==e&&q.cap)||rs.length>0}
function grab(e){if(capBusy(e))return;if(P.dual){P.dual=false;e.cap=true;e.hp=1;burst(P.x+12,P.y,'#3bd0ff',30,250);e.s=2;e.mode=null;e.t0=1;e.shot=9;e.x0=e.x;snd(300,.5,'sine',.06,600)}else{P.capt={e,t:0,sx:P.x,sy:P.y};eb=[]}}
const grp=(r,c)=>r==0?0:r==1?((c>=2&&c<=5)?0:1):r==2?((c<=1||c>=6)?1:(c<4?2:3)):(c<4?2:3);
function snd(f,d,t='square',v=.04,s=-f*.5){try{snd2(f,d,t,v,s)}catch(e){}}
function snd2(f,d,t,v,s){if(!ac)return;const n=ac.currentTime,o=ac.createOscillator(),a=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(ac.destination);o.start();o.stop(n+d)}
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=R()*TAU,v=sp*(.3+R()*.7);pt.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5+R()*.6,m:1.1,c})}}
function start(){score=0;wave=0;lives=3;geoms=0;chain=0;en=[];pb=[];eb=[];pu=[];ge=[];rs=[];bonus=false;msgT=0;
P={x:W/2,y:H-70,inv:1.5,pw:1,cd:0};S='play';spawn()}
const TYPES=[{c:'#ff3b5c',pts:100,hp:1},{c:'#ffe94a',pts:150,hp:1},{c:'#7dff4a',pts:200,hp:1},{c:'#3bff8a',pts:500,hp:3}];
function spawn(){wave++;banner=1.6;en=[];bonus=wave%4==3;
if(bonus){bTotal=40;bHits=0;bRate=.28+wave*.005;for(let g=0;g<5;g++)for(let i=0;i<8;i++)en.push({col:i,row:0,g,t:[0,1,2,0,1][g],hp:1,s:4,p:-(g*2.6+i*.32)-1.2,x:0,y:-50,rot:0,f:0,dc:99});return}
const cnt=[0,0,0,0];let i=0;
for(let row=0;row<4;row++)for(let col=0;col<8;col++){
if(row==0&&(col<2||col>5))continue;
const t=row==0?3:(row==1?0:row==2?1:2),g=grp(row,col);
en.push({col,row,t,hp:TYPES[t].hp,s:0,p:-(g*.75+(cnt[g]++)*.07)-.3,g,d:((g%2==0)?1:-1)*(wave%2?-1:1),dir:1,x:0,y:-50,rot:0,f:0,dc:(t==3?1.5+R()*2.5:2+R()*6/(1+wave*.12))});i++}}
function slot(e){return[W/2+(e.col-3.5)*46*(1+.06*Math.sin(time*1.5))+Math.sin(time*.9)*38,100+e.row*38]}
function efire(x,y,aim=1){const a=Math.atan2(P.y-y,P.x-x)+(R()-.5)*(.5/(aim));const v=190+wave*9;eb.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v})}
function drop(x,y){if(R()<.4)ge.push({x,y,vx:(R()-.5)*120,vy:-40+R()*60,l:9})}
function mult(){return 1+Math.floor(geoms/10)}
function kill(e,i){e.hp--;e.f=.08;snd(500,.08,'square',.03);if(e.hp>0)return;
const T=TYPES[e.t];chain++;chainT=2.2;
if(e.cap)rs.push({x:e.x,y:e.y-30,r:0});
if(P.capt&&P.capt.e===e)P.capt=null;
if(bonus)bHits++;
score+=bonus?200:T.pts*(e.s==2?2:1)*mult()*(1+Math.floor(chain/5));
burst(e.x,e.y,T.c,26,300);push(e.x,e.y,150,14);shake=Math.max(shake,4);snd(180,.25,'sawtooth',.05);
drop(e.x,e.y);if(chain%20==0){pu.push({x:e.x,y:e.y})}
en.splice(i,1)}
function hurt(){if(P.inv>0||P.capt)return;
if(P.dual){P.dual=false;burst(P.x+12,P.y,'#ffffff',40,350);push(P.x,P.y,250,24);shake=8;snd(140,.5,'sawtooth',.07);eb=[];P.inv=1.5;return}lives--;P.pw=1;P.pc=0;chain=0;geoms=Math.floor(geoms/2);
burst(P.x,P.y,'#ffffff',60,420);burst(P.x,P.y,'#19e6ff',40,300);push(P.x,P.y,300,30);shake=14;snd(120,.7,'sawtooth',.08);
eb=[];P.inv=2.2;if(lives<=0){S='over';if(score>hi){hi=score;try{localStorage.setItem('geo_hi',hi)}catch(e){}}}}
function update(dt){
time+=dt;
for(const s of stars){s.y+=s.s*dt;if(s.y>H){s.y=0;s.x=R()*W}}
for(const p of grid){p.vx+=(p.ox-p.x)*.09;p.vy+=(p.oy-p.y)*.09;p.vx*=.88;p.vy*=.88;p.x+=p.vx;p.y+=p.vy}
for(let i=pt.length-1;i>=0;i--){const p=pt[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy*=.985;p.l-=dt;if(p.l<=0)pt.splice(i,1)}

if(S!='play')return;
chainT-=dt;if(chainT<=0)chain=0;P.inv-=dt;P.cd-=dt;if(P.pw>1){P.pt=(P.pt??15)-dt;if(P.pt<=0){P.pw--;P.pt=12}}
if(P.capt){const c=P.capt;c.t+=dt;const k=Math.min(1,c.t/1.8);P.cx=c.sx+(c.e.x-c.sx)*k;P.cy=c.sy+(c.e.y+26-c.sy)*k;
if(c.t>=1.8){c.e.cap=true;c.e.hp=1;c.e.s=0;c.e.p=0;c.e.mode=null;P.capt=null;lives--;chain=0;eb=[];if(lives<=0)over();else{P.x=W/2;P.inv=2.5;P.pw=1;push(W/2,P.y,200,20)}}}
const sp=340;
if(gpx)tx=null;if(P.capt){}else if(tx!=null)P.x+=Math.max(-sp*dt,Math.min(sp*dt,tx-P.x));
else{const d=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0)+gpx;P.x+=Math.max(-1,Math.min(1,d))*sp*dt}
{const m=P.dual?30:18;P.x=Math.max(m,Math.min(W-m,P.x))}
if(!P.capt&&(firing||keys.Space||gpfire)&&P.cd<=0){P.cd=.17;snd(900,.09,'square',.025,-500);
const o=P.pw==1?[0]:P.pw==2?[-8,8]:[-10,0,10];
(P.dual?[-12,12]:[0]).forEach(c=>o.forEach((d,k)=>pb.push({x:P.x+c+d,y:P.y-16,vx:P.pw==3?(k-1)*90:0,vy:-740})))}
pt.push({x:P.x+(R()-.5)*6,y:P.y+14,vx:(R()-.5)*40,vy:160+R()*80,l:.25,m:.4,c:'#ff8a1a'});
for(let i=pb.length-1;i>=0;i--){const b=pb[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y<-20)pb.splice(i,1)}
for(let i=eb.length-1;i>=0;i--){const b=eb[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
if(b.y>H+20||b.x<-20||b.x>W+20){eb.splice(i,1);continue}
if(Math.abs(b.x-P.x)<(P.dual?23:11)&&Math.abs(b.y-P.y)<13&&P.inv<=0){eb.splice(i,1);hurt()}}
let divers=0;for(const e of en)if(e.s==2)divers++;
for(const e of en){e.f-=dt;e.rot+=dt*(e.s==2?7:1.2)*(e.t==1?1:-1);
if(e.s==0){e.p+=dt*Math.min(.6,.4+wave*.015);if(e.p>=0){const p=Math.min(e.p,1),[sx,sy]=slot(e),q=1-p,sd=e.d,gs=e.g>=2;
const x0=gs?(sd>0?-30:W+30):W/2-sd*110,y0=gs?H*.62:-30,mx=gs?W/2:W/2+sd*140,my=gs?H*.3:H*.5;
let x=q*q*x0+2*q*p*mx+p*p*sx,y=q*q*y0+2*q*p*my+p*p*sy;
if(p>.4&&p<.65){const a=(p-.4)/.25*TAU;x+=sd*60*Math.sin(a);y-=60*(1-Math.cos(a))}
e.x=x;e.y=y;if(!e.sh&&p>.3&&p<.9&&wave>1&&R()<dt*.7){e.sh=1;efire(e.x,e.y,2)}
if(e.p>=1)e.s=1}}
else if(e.s==1){[e.x,e.y]=slot(e);e.dc-=dt;if(e.dc<=0&&divers<Math.min(6,1+Math.floor(wave/2))){e.s=2;e.t0=0;e.x0=e.x;e.ph=R()*TAU;e.shot=0;divers++;e.mode=(e.t==3&&!e.cap&&!P.capt&&!en.some(q=>q.cap||q.mode||q.s==3)&&!capBusy(e)&&R()<.95)?'beam':null;if(e.mode)e.shot=9}}
else if(e.s==4){e.p+=dt;if(e.p>=0){const u=e.p*bRate;e.x=W/2+BS[e.g]*Math.sin(u*BF[e.g])*BA[e.g];e.y=-30+u*(H+70);if(u>1)e.gone=true}}
else if(e.s==3){e.bt+=dt;e.sn-=dt;if(!P.capt&&capBusy(e)){e.s=2;e.mode=null;e.t0=1;e.shot=9;e.x0=e.x}else if(beamOn(e)){if(e.sn<=0){snd(200+R()*300,.12,'sine',.03,100);e.sn=.08}
if(!P.capt&&P.y>e.y+16&&Math.abs(P.x-e.x)<(P.y-e.y-16)*.4+8)grab(e)}
else if(e.bt>=4.2&&!P.capt){e.s=2;e.mode=null;e.t0=1;e.shot=9;e.x0=e.x}}
else{e.t0+=dt;e.y+=(160+wave*12)*dt;e.x0+=(P.x-e.x0)*.4*dt;e.x=Math.max(20,Math.min(W-20,e.x0+Math.sin(e.t0*3+e.ph)*80));if(e.mode=='beam'&&e.y>H*.42){e.s=3;e.bt=0;e.sn=0}
if(e.t0>.5&&e.shot<1+(wave>3?1:0)+(wave>7?1:0)){e.shot++;efire(e.x,e.y,2)}
if(e.y>H+30){e.s=0;e.p=0;e.sh=0;e.dc=(e.t==3?2+R()*2:3+R()*5)}}e.tl=e.x-(e.lx??e.x);{const dy=e.y-(e.ly??e.y);let tg=Math.PI-Math.max(-.7,Math.min(.7,e.tl*.07));
if(e.s==0||e.s==4){if(e.p>=0&&e.tl*e.tl+dy*dy>.01)tg=Math.atan2(dy,e.tl)+Math.PI/2;else tg=e.ra??tg}
if(e.ra===undefined)e.ra=tg;const d=((tg-e.ra+Math.PI)%TAU+TAU)%TAU-Math.PI;e.ra+=d*Math.min(1,dt*14)}e.lx=e.x;e.ly=e.y}en=en.filter(e=>!e.gone);
for(const e of en){if(e.s==3&&e.bt>6&&!P.capt){e.s=2;e.mode=null;e.t0=1;e.shot=9;e.x0=e.x}
if(!isFinite(e.x)||!isFinite(e.y)){e.x=W/2;e.y=-30;e.s=0;e.p=0}}
if(P.capt&&(P.capt.t>4||!en.includes(P.capt.e)))P.capt=null;
shotT-=dt;if(shotT<=0&&!bonus){const f=en.filter(e=>e.s==1),e2=f[0|R()*f.length];if(e2)efire(e2.x,e2.y,1);shotT=Math.max(.3,1.3-wave*.07)*(.5+R())}
for(let i=en.length-1;i>=0;i--){const e=en[i];if(e.p<0)continue;
for(let j=pb.length-1;j>=0;j--){const b=pb[j];if(Math.hypot(b.x-e.x,b.y-e.y)<19){pb.splice(j,1);kill(e,i);break}}}
for(const e of en){if(e.p>=0&&e.s!=4&&Math.abs(e.x-P.x)<(P.dual?34:22)&&Math.abs(e.y-P.y)<22&&P.inv<=0&&!P.capt){hurt();break}}
for(let i=ge.length-1;i>=0;i--){const q=ge[i];q.l-=dt;q.vx*=.97;q.vy+=40*dt;
const d=Math.hypot(P.x-q.x,P.y-q.y);if(d<150){q.vx+=(P.x-q.x)/d*900*dt;q.vy+=(P.y-q.y)/d*900*dt}
q.x+=q.vx*dt;q.y+=q.vy*dt;
if(d<18){geoms++;score+=10*mult();snd(1200+Math.min(geoms,40)*20,.05,'sine',.03,200);ge.splice(i,1)}else if(q.l<=0||q.y>H+10)ge.splice(i,1)}
for(let i=rs.length-1;i>=0;i--){const q=rs[i];q.y+=105*dt;q.r+=dt*10;q.x+=Math.max(-240*dt,Math.min(240*dt,P.x-q.x));
if(!P.capt&&Math.abs(q.x-P.x)<36&&Math.abs(q.y-P.y)<40){P.dual=true;score+=1000*mult();burst(P.x,P.y,'#fff',50,300);snd(500,.4,'triangle',.06,900);rs.splice(i,1)}else if(q.y>H+20)rs.splice(i,1)}
for(let i=pu.length-1;i>=0;i--){const q=pu[i];q.y+=80*dt;
if(Math.hypot(P.x-q.x,P.y-q.y)<22){if(P.pw<3){P.pc=(P.pc||0)+1;if(P.pc>=2){P.pw++;P.pc=0}P.pt=15}else{score+=500*mult();P.pt=15}snd(600,.3,'triangle',.06,600);burst(q.x,q.y,'#ffe94a',20,200);pu.splice(i,1)}else if(q.y>H+20)pu.splice(i,1)}
if(banner>0)banner-=dt;if(msgT>0)msgT-=dt;
if(!en.length&&banner<=0){if(bonus){const pf=bHits>=bTotal;if(pf)score+=10000;score+=bHits*100;msg=pf?'PERFECT! +10000':'HITS '+bHits+'/'+bTotal;msgT=2.8}else score+=1000*wave;spawn()}}
function ngon(n,r,rot,x,y){const a=[];for(let i=0;i<n;i++){const t=rot+i*TAU/n;a.push([x+Math.cos(t)*r,y+Math.sin(t)*r])}return a}
function poly(pts,c,lw=2,close=true){g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));if(close)g.closePath();g.strokeStyle=c;g.globalAlpha=.25;g.lineWidth=lw*3.5;g.stroke();g.globalAlpha=1;g.lineWidth=lw;g.stroke()}
function txt(s,x,y,sz,c,al='left'){g.font='bold '+sz+'px "Courier New",monospace';g.textAlign=al;g.fillStyle=c;g.fillText(s,x,y)}
function mir(p,c,lw){poly(p,c,lw);poly(p.map(([x,y])=>[-x,y]),c,lw)}
function ship(x,y,sc,rot=0,fc='#f0f6ff'){g.save();g.translate(x,y);g.rotate(rot);g.scale(sc,sc);
mir([[-3,0],[-9,-6],[-14,-6],[-14,14],[-3,11]],'#ff3b5c',2);
mir([[-13,-6],[-13,-16]],'#ffffff',2);
poly([[0,-21],[4,-8],[4,10],[0,15],[-4,10],[-4,-8]],fc,2);
poly([[-2,-2],[2,-2],[2,5],[-2,5]],'#4a7bff',1.5);g.restore()}
function drawEnemy(e){const h=e.f>0,f=1+Math.sin(time*12+e.col*.7)*.18,k=e.t,C=c=>h?'#fff':c,V=p=>p.map(([x,y])=>[x*f,y]);
g.save();g.translate(e.x,e.y);g.rotate(e.ra??Math.PI);g.scale(1.15,1.15);
if(k==0){mir(V([[-3,-3],[-15,-10],[-16,-1],[-3,3]]),C('#ff3b5c'),2);mir(V([[-3,2],[-14,4],[-12,11],[-3,7]]),C('#4a7bff'),2);poly([[0,-8],[3,0],[0,9],[-3,0]],C('#ffe94a'),2)}
else if(k<3){const a=k==1?'#ffe94a':'#7dff4a',b=k==1?'#4a7bff':'#ff4ad6';mir(V([[-5,-3],[-14,-8],[-15,2],[-5,5]]),C(b),2);poly([[0,-8],[5,-4],[5,6],[0,10],[-5,6],[-5,-4]],C(a),2)}
else{mir(V([[-8,-4],[-17,-12],[-18,4],[-8,8]]),C('#4a7bff'),2);poly([[0,-10],[8,-6],[10,6],[4,12],[-4,12],[-10,6],[-8,-6]],C(e.hp>1?'#3bff8a':'#b06bff'),2);
mir([[-4,-10],[-7,-17]],C('#ff3b5c'),2);poly([[0,-3],[2,0],[0,3],[-2,0]],'#ffe94a',1.5)}
g.restore();if(e.cap)ship(e.x,e.y-32,.75,0,'#ff5a5a')}
function drawBeam(e){const y0=e.y+16,L=H-34-y0,k=.4;g.strokeStyle='#3bd0ff';g.lineWidth=2;g.globalAlpha=.9;g.beginPath();g.moveTo(e.x-4,y0);g.lineTo(e.x-4-L*k,y0+L);g.moveTo(e.x+4,y0);g.lineTo(e.x+4+L*k,y0+L);g.stroke();g.globalAlpha=.6;for(let i=0;i<9;i++){const y=y0+((i/9+time*.7)%1)*L,w=4+(y-y0)*k;g.beginPath();g.moveTo(e.x-w,y);g.lineTo(e.x+w,y);g.stroke()}g.globalAlpha=1}
function draw(){
g.globalCompositeOperation='source-over';g.fillStyle='#02020a';g.fillRect(0,0,W,H);
g.save();if(shake>.3)g.translate((R()-.5)*shake,(R()-.5)*shake);
g.fillStyle='#8aa4ff';for(const s of stars){g.globalAlpha=s.s/140;g.fillRect(s.x,s.y,1.5,1.5)}g.globalAlpha=1;
g.lineWidth=1;g.strokeStyle='rgba(50,100,255,.35)';g.beginPath();
for(let r=0;r<GR;r++)for(let c=0;c<GC;c++){const p=grid[r*GC+c];c?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)}
for(let c=0;c<GC;c++)for(let r=0;r<GR;r++){const p=grid[r*GC+c];r?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)}
g.stroke();
g.globalCompositeOperation='lighter';
for(const p of pt){g.globalAlpha=Math.min(1,p.l*2);g.strokeStyle=p.c;g.lineWidth=2;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-p.vx*.05,p.y-p.vy*.05);g.stroke()}
g.globalAlpha=1;
for(const q of ge){poly(ngon(4,5,time*4,q.x,q.y),'#7dff4a',1.5)}
for(const q of pu){poly(ngon(4,13,time*2,q.x,q.y),'#ffe94a',2);poly(ngon(4,6,-time*3,q.x,q.y),'#ffffff',1.5)}
for(const e of en){if(e.p>=0)drawEnemy(e)}
for(const e of en)if(beamOn(e))drawBeam(e);
for(const q of rs)ship(q.x,q.y,.9,q.r,'#ff5a5a');
for(const b of pb){poly([[b.x,b.y-10],[b.x,b.y+8]],'#9ffcff',2.5,false)}
for(const b of eb){poly(ngon(4,5,time*10,b.x,b.y),'#ff4a3a',2)}
if(S=='play'){if(P.capt)ship(P.cx??P.x,P.cy??P.y,1.1,P.capt.t*9);else if(P.inv<=0||Math.floor(time*16)%2){if(P.dual){ship(P.x-12,P.y,1);ship(P.x+12,P.y,1)}else ship(P.x,P.y,1.1)}};
g.globalCompositeOperation='source-over';g.restore();
if(S!='title'){
txt('SCORE '+score,12,26,18,'#cfe8ff');txt('HI '+hi,W-12,26,14,'#7b8bbf','right');
txt('WAVE '+wave,W/2,26,14,'#ff2bd6','center');
g.globalCompositeOperation='lighter';for(let i=0;i<lives;i++)ship(20+i*26,H-22,.7);g.globalCompositeOperation='source-over';
txt('x'+mult()+' GEOMS '+geoms,W-12,H-14,14,'#7dff4a','right');

let last=performance.now();
function fixup(){g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';
const ok=o=>isFinite(o.x)&&isFinite(o.y);en=en.filter(ok);eb=eb.filter(ok);pb=pb.filter(ok);pt=pt.filter(ok);ge=ge.filter(ok);pu=pu.filter(ok);rs=rs.filter(ok);
if(P&&!isFinite(P.x))P.x=W/2}
function loop(n){requestAnimationFrame(loop);const dt=Math.max(0,Math.min(.033,(n-last)/1000));last=n;
try{update(dt);draw()}catch(err){console.error(err);try{g.restore()}catch(e){}fixup()}}
requestAnimationFrame(loop);
function init(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state=='suspended')ac.resume()}
addEventListener('keydown',e=>{init();keys[e.code]=true;
if(['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code))tx=null;
if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
if(e.code=='Space'&&S!='play'&&!e.repeat)start()});
addEventListener('keyup',e=>{keys[e.code]=false});
function setTx(e){const r=cv.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*W}
function cpos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
cv.addEventListener('pointerdown',e=>{init();if(S!='play')start();
if(e.pointerType=='touch'){const[x,y]=cpos(e);if(x<W/2&&!vs)vs={id:e.pointerId,bx:x,by:y,x,y};else vf.add(e.pointerId)}
else{firing=true;setTx(e)}});
cv.addEventListener('pointermove',e=>{if(e.pointerType=='touch'){if(vs&&vs.id==e.pointerId){[vs.x,vs.y]=cpos(e)}}else setTx(e)});
const up=e=>{if(e.pointerType!='touch')firing=false;if(vs&&vs.id==e.pointerId)vs=null;vf.delete(e.pointerId)};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
</script></body></html>
