<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hare Lift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: one letterboxed arcade screen centered in a dark cabinet; glass control chips pinned top-right */
:root{
  --cab:#0a0d1c; --cab2:#171c38; --chip:rgba(255,255,255,.07); --chip-line:rgba(255,236,200,.18);
  --ink:#f6ecd9; --amber:#ffb84d;
  --display:'Lilita One','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;background:var(--cab);
  background-image:radial-gradient(ellipse at 50% 35%,var(--cab2),var(--cab) 72%);
  color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#game{display:block;border-radius:12px;touch-action:none;cursor:crosshair;
  box-shadow:0 0 0 1px rgba(255,230,190,.08),0 30px 80px rgba(0,0,0,.55),0 0 120px rgba(255,160,90,.08)}
.chips{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);
  right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:8px}
.chip{font:800 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);
  background:var(--chip);border:1px solid var(--chip-line);border-radius:999px;padding:8px 12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;display:flex;align-items:center;gap:6px}
.chip:hover{background:rgba(255,255,255,.14)}
.chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.chip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip.vr{background:linear-gradient(135deg,rgba(255,184,77,.35),rgba(255,120,90,.25));border-color:rgba(255,184,77,.6)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);
  max-width:min(520px,calc(100% - 32px));background:rgba(15,18,40,.92);border:1px solid var(--chip-line);
  color:var(--ink);font:700 14px/1.4 var(--body);padding:10px 16px;border-radius:12px;z-index:6;text-align:center}
@media (max-width:560px){.chip span{display:none}.chip{padding:8px 10px}}
</style>

<div id="wrap"><canvas id="game" aria-label="Hare Lift game screen" tabindex="0"></canvas></div>
<div class="chips">
  <button class="chip" id="bPause" title="Pause (P)"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg><span>Pause</span></button>
  <button class="chip" id="bSound" title="Sound (M)"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="sndWave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg><span id="sndLbl">Sound</span></button>
  <button class="chip" id="bFull" title="Fullscreen (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Full</span></button>
  <button class="chip vr" id="bVR" hidden title="Play in VR on Meta Quest"><svg viewBox="0 0 24 24"><path d="M3 8h18v9h-6l-3-3-3 3H3z"/></svg><span>Enter VR</span></button>
</div>
<div id="toast" hidden></div>

<script>
(()=>{
'use strict';
/* ================= constants & helpers ================= */
const W=960,H=540,GROUND=486,GX=842,TOPY=136,BOTY=446,LADX=918,AIM=30;
const SLOTS=[150,222,294,366];
const TAU=Math.PI*2;
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const midi=m=>440*Math.pow(2,(m-69)/12);
function mulberry(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

/* ================= themes ================= */
const THEMES=[
 {name:'Morning',sky:['#2b78cc','#79c0ec','#e6f5ee'],sun:{x:300,y:118,r:30,c:'#fffbe6',glow:'rgba(255,244,200,0.55)'},
  mount:['#9dbcd6','#7399b7','#527d92'],haze:'#d9eef3',forest:['#3b6b56','#244a3c'],ground:['#86c257','#3e7a34'],
  cloud:['#ffffff','#cfdeec'],tint:null,rays:true,stars:false,motes:'rgba(255,255,230,0.7)',root:57},
 {name:'Dusk',sky:['#211a4c','#b0466b','#f7a65a'],sun:{x:520,y:338,r:46,c:'#ffd896',glow:'rgba(255,140,90,0.6)'},
  mount:['#86517e','#5e3762','#3c2649'],haze:'#f19c78',forest:['#33203f','#1e1229'],ground:['#7a8f42','#33402a'],
  cloud:['#ffcaa2','#b46384'],tint:'#f4cdb8',rays:true,stars:false,motes:'rgba(255,210,150,0.7)',root:55},
 {name:'Night',sky:['#050918','#14204a','#31407c'],sun:{x:690,y:108,r:24,c:'#eef2ff',glow:'rgba(160,185,255,0.35)',moon:true},
  mount:['#2c376a','#1e2852','#131a3b'],haze:'#3a4986',forest:['#0e1430','#070b1e'],ground:['#35543f','#152320'],
  cloud:['#5b679b','#2b3564'],tint:'#8d98d8',rays:false,stars:true,motes:null,root:52},
 {name:'Dawn',sky:['#363b76','#e3867a','#fcd7a6'],sun:{x:200,y:300,r:40,c:'#fff1cc',glow:'rgba(255,200,150,0.6)'},
  mount:['#b38ca8','#88698e','#5d4a6d'],haze:'#f6c3a5',forest:['#42354f','#2a2135'],ground:['#8db75a','#46663a'],
  cloud:['#ffe4cf','#d29ba9'],tint:'#fde6d8',rays:true,stars:false,motes:'rgba(255,230,200,0.7)',root:53},
];
const BALLOON_HUES=[354,44,170,268,208,328,96,22];
const COATS={fox:{main:'#ec7a2e',dark:'#a4461a',light:'#fff3e2',ear:'#3a1d10'},rogue:{main:'#9e3b2c',dark:'#561c17',light:'#f3d9c4',ear:'#22100c',mask:true}};

/* ================= canvas scaling & static layers ================= */
let K=1;
const L={bg:null,fg:null,bush:null,vig:null,clouds:[]};
function layer(){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(W*K));c.height=Math.max(1,Math.round(H*K));const g=c.getContext('2d');g.setTransform(K,0,0,K,0,0);return[c,g];}
function setK(k){K=k;cv.width=Math.round(W*k);cv.height=Math.round(H*k);buildStatic();}
function resize(){
  if(XR.active)return;
  const vw=wrap.clientWidth,vh=wrap.clientHeight;
  const s=Math.max(0.2,Math.min(vw/W,vh/H));
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  const nk=s*dpr; if(Math.abs(nk-K)>0.01||!L.bg)setK(nk);
}

function ridge(g,base,amp,col,bottom,seed,freq){
  const r=mulberry(seed),ph=[r()*10,r()*10,r()*10,r()*10];
  const pts=[];
  for(let x=0;x<=W;x+=4){
    const n=Math.sin(x*0.004*freq+ph[0])*0.5+Math.sin(x*0.011*freq+ph[1])*0.28+Math.abs(Math.sin(x*0.027*freq+ph[2]))*0.18+Math.sin(x*0.08+ph[3])*0.04;
    pts.push([x,base-amp*(0.5+n*0.6)]);
  }
  g.beginPath();g.moveTo(0,H);pts.forEach(p=>g.lineTo(p[0],p[1]));g.lineTo(W,H);g.closePath();
  const gr=g.createLinearGradient(0,base-amp*1.1,0,base+70);gr.addColorStop(0,col);gr.addColorStop(1,bottom);
  g.fillStyle=gr;g.fill();
  g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));
  g.strokeStyle='rgba(255,255,255,0.10)';g.lineWidth=1.2;g.stroke();
}
function pines(g,y0,col,n,hmin,hmax,seed){
  const r=mulberry(seed);g.fillStyle=col;
  for(let i=0;i<n;i++){
    const x=r()*W,h=hmin+r()*(hmax-hmin),w=h*0.36;
    for(let k=0;k<3;k++){const ty=y0-h+k*h*0.24,bw=w*(0.55+k*0.25);
      g.beginPath();g.moveTo(x,ty);g.lineTo(x+bw,ty+h*0.42);g.lineTo(x-bw,ty+h*0.42);g.closePath();g.fill();}
    g.fillRect(x-1.5,y0-h*0.2,3,h*0.2+2);
  }
  g.fillRect(0,y0,W,H-y0);
}
function buildStatic(){
  const T=G.theme;
  /* --- background: sky, stars, sun, mountains, forest --- */
  let [c,g]=layer();
  let gr=g.createLinearGradient(0,0,0,GROUND);
  gr.addColorStop(0,T.sky[0]);gr.addColorStop(0.62,T.sky[1]);gr.addColorStop(1,T.sky[2]);
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  if(T.stars){const r=mulberry(7);for(let i=0;i<220;i++){const x=r()*W,y=r()*360,s=r();g.fillStyle=`rgba(255,255,255,${0.25+s*0.6})`;g.beginPath();g.arc(x,y,0.4+s*1.1,0,TAU);g.fill();}
    const mw=g.createLinearGradient(0,40,W,300);mw.addColorStop(0,'rgba(140,160,255,0)');mw.addColorStop(0.5,'rgba(170,180,255,0.10)');mw.addColorStop(1,'rgba(140,160,255,0)');
    g.save();g.translate(480,180);g.rotate(-0.35);g.fillStyle=mw;g.fillRect(-600,-40,1200,80);g.restore();}
  const S=T.sun;
  gr=g.createRadialGradient(S.x,S.y,S.r*0.5,S.x,S.y,S.r*7);gr.addColorStop(0,S.glow);gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.fillStyle=S.c;g.beginPath();g.arc(S.x,S.y,S.r,0,TAU);g.fill();
  if(S.moon){g.fillStyle='rgba(150,160,200,0.35)';[[-8,-6,6],[7,4,4],[-2,9,3],[9,-9,2.5]].forEach(m=>{g.beginPath();g.arc(S.x+m[0],S.y+m[1],m[2],0,TAU);g.fill();});}
  ridge(g,330,150,T.mount[0],T.haze,11,1.0);
  ridge(g,385,110,T.mount[1],T.haze,23,1.4);
  gr=g.createLinearGradient(0,330,0,470);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(1,T.haze);
  g.globalAlpha=0.55;g.fillStyle=gr;g.fillRect(0,330,W,160);g.globalAlpha=1;
  ridge(g,430,80,T.mount[2],T.forest[0],37,2.0);
  pines(g,462,T.forest[0],70,22,52,5);
  pines(g,478,T.forest[1],60,20,40,9);
  g.fillStyle=T.ground[1];g.fillRect(0,GROUND,W,H-GROUND);
  L.bg=c;

  /* --- foreground: ground, cliff, tower, burrow --- */
  [c,g]=layer();
  gr=g.createLinearGradient(0,GROUND-8,0,H);gr.addColorStop(0,T.ground[0]);gr.addColorStop(1,T.ground[1]);
  g.fillStyle=gr;g.beginPath();g.moveTo(0,H);
  for(let x=0;x<=W;x+=8)g.lineTo(x,GROUND-3+Math.sin(x*0.07)*2+Math.sin(x*0.19)*1.5);
  g.lineTo(W,H);g.closePath();g.fill();
  // dirt path
  g.fillStyle='rgba(120,80,40,0.35)';g.beginPath();g.ellipse(560,GROUND+16,420,7,0,0,TAU);g.fill();
  let r=mulberry(3);
  for(let i=0;i<260;i++){const x=r()*W,y=GROUND+r()*(H-GROUND),h=3+r()*6;g.strokeStyle=r()<0.5?'rgba(255,255,255,0.10)':'rgba(0,30,0,0.18)';g.lineWidth=1;g.beginPath();g.moveTo(x,y);g.lineTo(x+r()*3-1.5,y-h);g.stroke();}
  for(let i=0;i<40;i++){const x=180+r()*660,y=GROUND+4+r()*40;g.fillStyle=['#ffe27a','#ffffff','#ff9fb8','#b9a7ff'][i%4];g.globalAlpha=0.8;g.beginPath();g.arc(x,y,1.6,0,TAU);g.fill();}
  g.globalAlpha=1;
  // cliff
  const cp=[[0,86],[34,82],[78,86],[124,88],[152,96],[160,130],[150,180],[164,238],[150,300],[168,360],[158,420],[174,GROUND+6],[0,GROUND+6]];
  g.save();g.beginPath();cp.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();
  gr=g.createLinearGradient(0,80,170,GROUND);gr.addColorStop(0,'#a8957c');gr.addColorStop(0.5,'#7d6a58');gr.addColorStop(1,'#544538');
  g.fillStyle=gr;g.fill();g.clip();
  r=mulberry(19);
  for(let i=0;i<9;i++){const y=130+i*42+r()*12;g.strokeStyle='rgba(40,26,16,0.28)';g.lineWidth=2;g.beginPath();g.moveTo(0,y);g.bezierCurveTo(60,y+r()*16-8,110,y+r()*16-8,180,y+r()*10);g.stroke();
    g.strokeStyle='rgba(255,240,220,0.10)';g.lineWidth=1.5;g.beginPath();g.moveTo(0,y+4);g.bezierCurveTo(60,y+4+r()*10-5,110,y+4,180,y+6);g.stroke();}
  for(let i=0;i<80;i++){g.fillStyle=r()<0.5?'rgba(30,20,10,0.18)':'rgba(255,240,220,0.10)';g.beginPath();g.ellipse(r()*170,100+r()*390,2+r()*6,1+r()*3,r()*3,0,TAU);g.fill();}
  gr=g.createLinearGradient(120,0,175,0);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(20,10,30,0.35)');g.fillStyle=gr;g.fillRect(0,0,180,H);
  // den hole
  g.fillStyle='#2a1c14';g.beginPath();g.ellipse(70,GROUND-18,26,22,0,Math.PI,0);g.lineTo(96,GROUND+6);g.lineTo(44,GROUND+6);g.fill();
  g.restore();
  // grass cap
  g.fillStyle=T.ground[0];g.beginPath();g.moveTo(0,80);
  [[34,76],[78,80],[124,82],[154,92]].forEach(p=>g.lineTo(p[0],p[1]));
  g.lineTo(156,100);for(let x=152;x>=0;x-=8)g.lineTo(x,92+Math.sin(x*0.5)*3+(x%24===0?8:0));g.closePath();g.fill();
  g.strokeStyle='rgba(255,255,255,0.18)';g.lineWidth=1.5;g.beginPath();g.moveTo(0,80);g.lineTo(34,76);g.lineTo(78,80);g.lineTo(124,82);g.stroke();
  // tower posts and braces
  const wood=(x,y,w,h)=>{const gg=g.createLinearGradient(x,0,x+w,0);gg.addColorStop(0,'#9a6a3f');gg.addColorStop(1,'#5e3a1f');g.fillStyle=gg;g.fillRect(x,y,w,h);};
  g.strokeStyle='#5a3a20';g.lineWidth=4;
  for(let y=70;y<GROUND-40;y+=96){g.beginPath();g.moveTo(898,y);g.lineTo(952,y+96);g.moveTo(952,y);g.lineTo(898,y+96);g.stroke();}
  wood(892,26,9,GROUND-20);wood(948,26,9,GROUND-20);
  // ladder
  wood(904,40,4,GROUND-34);wood(929,40,4,GROUND-34);
  for(let y=50;y<GROUND;y+=17){g.fillStyle='#8a5a32';g.fillRect(906,y,26,3.5);g.fillStyle='rgba(255,230,190,0.25)';g.fillRect(906,y,26,1);}
  // beam & brace
  wood(806,22,160,11);g.fillStyle='rgba(255,230,190,0.25)';g.fillRect(806,22,160,2);
  g.strokeStyle='#6a4426';g.lineWidth=6;g.beginPath();g.moveTo(896,96);g.lineTo(858,34);g.stroke();
  // small idler wheel bracket
  g.fillStyle='#3d2614';g.fillRect(880,30,10,6);
  // burrow mound + door
  gr=g.createLinearGradient(0,GROUND-50,0,GROUND+10);gr.addColorStop(0,T.ground[0]);gr.addColorStop(1,T.ground[1]);
  g.fillStyle=gr;g.beginPath();g.ellipse(950,GROUND+8,58,40,0,Math.PI,0);g.fill();
  g.fillStyle='#4f8a3a';g.beginPath();g.arc(944,GROUND-12,15,Math.PI,0);g.lineTo(959,GROUND+4);g.lineTo(929,GROUND+4);g.fill();
  g.strokeStyle='#2c4f22';g.lineWidth=2;g.stroke();
  g.fillStyle='#ffd27a';g.beginPath();g.arc(944,GROUND-16,4.5,0,TAU);g.fill();
  g.fillStyle='#e8c46a';g.beginPath();g.arc(953,GROUND-6,1.8,0,TAU);g.fill();
  L.fg=c;

  /* --- bushes (in front of rising foxes) --- */
  [c,g]=layer();r=mulberry(41);
  for(let i=0;i<16;i++){
    const cx=190+i*32+r()*14,cy=GROUND+10;
    for(let k=0;k<4;k++){const bx=cx+r()*30-15,by=cy-r()*10,br=9+r()*12;
      const bg2=g.createRadialGradient(bx-br*0.3,by-br*0.4,1,bx,by,br);bg2.addColorStop(0,T.ground[0]);bg2.addColorStop(1,T.forest[0]);
      g.fillStyle=bg2;g.beginPath();g.arc(bx,by,br,0,TAU);g.fill();}
  }
  for(let x=0;x<W;x+=3){const h=5+r()*12;g.strokeStyle=r()<0.5?T.ground[1]:T.forest[0];g.lineWidth=1.6;g.beginPath();g.moveTo(x,H);g.quadraticCurveTo(x+2,H-h*0.6,x+r()*6-3,H-h);g.stroke();}
  L.bush=c;

  /* --- vignette --- */
  [c,g]=layer();
  gr=g.createRadialGradient(W/2,H*0.45,H*0.35,W/2,H*0.5,H*0.95);gr.addColorStop(0,'rgba(0,0,10,0)');gr.addColorStop(1,'rgba(5,4,20,0.5)');
  g.fillStyle=gr;g.fillRect(0,0,W,H);L.vig=c;

  /* --- cloud sprites --- */
  L.clouds=[];
  for(let i=0;i<5;i++){
    const cw=240,ch=110;const c2=document.createElement('canvas');c2.width=Math.round(cw*K);c2.height=Math.round(ch*K);
    const g2=c2.getContext('2d');g2.setTransform(K,0,0,K,0,0);const rr=mulberry(100+i);
    const blobs=[];const n=9+Math.floor(rr()*6);
    for(let k=0;k<n;k++){const t=k/(n-1);blobs.push([30+t*180+rr()*20-10,70-Math.sin(t*Math.PI)*(18+rr()*22)+rr()*8,14+Math.sin(t*Math.PI)*22+rr()*10]);}
    blobs.forEach(b=>{g2.fillStyle=T.cloud[1];g2.beginPath();g2.arc(b[0],b[1]+5,b[2],0,TAU);g2.fill();});
    blobs.forEach(b=>{const gg=g2.createRadialGradient(b[0]-b[2]*0.3,b[1]-b[2]*0.5,1,b[0],b[1],b[2]);gg.addColorStop(0,T.cloud[0]);gg.addColorStop(1,T.cloud[0]+'00');g2.fillStyle=T.cloud[0];g2.globalAlpha=0.85;g2.beginPath();g2.arc(b[0],b[1],b[2]*0.92,0,TAU);g2.fill();g2.globalAlpha=1;});
    L.clouds.push(c2);
  }
}

/* ================= audio ================= */
const A={c:null,master:null,sfx:null,mus:null,revSend:null,noise:null,muted:store.get('harelift.muted',false)};
function ensureAudio(){
  try{
    if(!A.c){
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      const c=new C();A.c=c;
      const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.25;
      A.master=c.createGain();A.master.gain.value=A.muted?0:0.85;A.master.connect(comp);comp.connect(c.destination);
      A.sfx=c.createGain();A.sfx.gain.value=0.8;A.sfx.connect(A.master);
      A.mus=c.createGain();A.mus.gain.value=0.34;A.mus.connect(A.master);

const M={step:0,next:0,bpm:104,int:0.45,root:55};
const PROG=[[0,3,7],[-4,0,3],[3,7,10],[-2,2,5]];
function sched(){
  const c=A.c;if(!c)return;const spb=60/M.bpm/4;
  if(M.next<c.currentTime-0.5)M.next=c.currentTime+0.05;
  while(M.next<c.currentTime+0.15){playStep(M.step,M.next-c.currentTime,spb);M.next+=spb;M.step++;}
}
function playStep(s,T,spb){
  if(G.paused||A.muted)return;
  const bar=Math.floor(s/16)%4,st=s%16,ch=PROG[bar],r=M.root,I=M.int;
  if(st===0)ch.forEach(n=>[-8,8].forEach(d=>tone({type:'sawtooth',f:midi(r+12+n),t:T,dur:spb*16,a:0.6,v:0.028,dest:A.mus,filt:'lowpass',ff:850,det:d,rev:0.6})));
  if(I>0.35&&[0,3,6,8,11,14].includes(st))tone({type:'triangle',f:midi(r-12+ch[0]+(st===6||st===14?12:0)),t:T,dur:spb*1.7,v:0.22,dest:A.mus});
  if(I>0.3){const seq=[0,1,2,1,0,2,1,2];const n=ch[seq[st%8]]+(st>=8?12:0);tone({type:'square',f:midi(r+24+n),t:T,dur:spb*0.85,v:0.035,dest:A.mus,filt:'lowpass',ff:2300,rev:0.45});}
  if(I>0.6){
    if(st===0||st===8||(st===10&&I>0.9)){tone({f:150,f2:42,t:T,dur:0.22,v:0.5,dest:A.mus});}
    if(st===4||st===12){noise({t:T,dur:0.14,v:0.22,filt:'bandpass',ff:1800,q:0.8,dest:A.mus,rev:0.25});tone({type:'triangle',f:220,f2:150,t:T,dur:0.08,v:0.12,dest:A.mus});}
    if(st%2===0)noise({t:T,dur:0.04,v:st%4===2?0.07:0.035,filt:'highpass',ff:7500,dest:A.mus});
  }
}

const keys=new Set();
const inp={targetY:null,mouseDown:false,touchMove:null,tsY:0,tsG:0,touchFire:new Set(),aim:null,last:'kb',

function toGame(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}

function pollPads(){
  inp.padAxis=0;inp.padFire=false;let st=false;
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  for(const gp of pads){
    if(!gp||!gp.connected||gp.mapping==='xr-standard')continue;
    let a=gp.axes[1]||0;if(Math.abs(a)<0.22)a=0;
    const a2=gp.axes[3]||0;if(Math.abs(a2)>0.3&&!a)a=a2;
    if(gp.buttons[12]?.pressed)a=-1;if(gp.buttons[13]?.pressed)a=1;
    if(a){inp.padAxis=a;inp.last='pad';}
    for(const i of [0,1,2,3,5,7])if(gp.buttons[i]&&(gp.buttons[i].pressed||gp.buttons[i].value>0.4)){inp.padFire=true;inp.last='pad';}
    if(gp.buttons[9]?.pressed)st=true;
  }
  if(st&&!inp.prevStart){if(G.state==='play'||G.state==='clear'||G.paused)togglePause();else G.startReq=true;}
  inp.prevStart=st;
}
function readInput(){
  pollPads();
  let ax=0;if(keys.has('ArrowUp')||keys.has('KeyW'))ax-=1;if(keys.has('ArrowDown')||keys.has('KeyS'))ax+=1;
  ax=clamp(ax+inp.padAxis+inp.xrAxis,-1,1);
  if(ax)inp.targetY=null;
  if(inp.xrTarget!=null)inp.targetY=inp.xrTarget;
  const tap=inp.tap;inp.tap=false;
  const fire=tap||keys.has('Space')||keys.has('KeyZ')||keys.has('KeyJ')||keys.has('Enter')||inp.mouseDown||inp.touchFire.size>0||inp.padFire||inp.xrFire;
  return{ax,fire};
}

/* ================= update ================= */
function controlPlayer(ax,target,fire,dt){
  const prev=G.gy;
  if(G.hurtT>0){G.gy=clamp(G.gy+Math.sin(G.t*40)*0.6,TOPY,BOTY);}
  else{
    if(ax)G.gy+=ax*390*dt;
    else if(target!=null){const d=target-G.gy;G.gy+=clamp(d*Math.min(1,dt*12),-600*dt,600*dt);}
    G.gy=clamp(G.gy,TOPY,BOTY);
    if(fire&&G.cd<=0&&G.state!=='over'&&(G.meat==='held'||G.demo||G.arrows.filter(a=>a.st==='fly'||a.st==='drop').length<2))shoot();
  }
  G.gv=(G.gy-prev)/Math.max(dt,1e-4);
}
function demoAI(dt){
  G.aiT-=dt;
  let best=null,bd=1e9;
  for(const f of G.foxes){if(f.st!=='float')continue;const b=balloonsOf(f)[0];if(!b||b.x<190)continue;const d=Math.abs(b.y-(G.gy-AIM))+(GX-b.x)*0.2;if(d<bd){bd=d;best=b;}}
  let fire=false;
  if(best){const tt=(GX-46-best.x)/1050;const ty=best.y+35*tt;G.aiTarget=ty+AIM;fire=Math.abs(G.gy-AIM-ty)<9&&G.aiT<=0;if(fire)G.aiT=rand(0.15,0.6);}
  else G.aiTarget=lerp(G.aiTarget,300+Math.sin(G.t*0.6)*90,dt);
  controlPlayer(0,G.aiTarget,fire,dt);
}
function updateFox(f,dt){
  f.t+=dt;if(f.flinch)f.flinch=Math.max(0,f.flinch-dt);
  switch(f.st){
    case 'prep':f.inf=Math.min(1,f.inf+dt*1.3);if(f.inf>=1){f.st='float';f.vx=rand(70,100);}break;
    case 'rise0':f.inf=Math.min(1,f.inf+dt*1.1);f.y=lerp(f.y,GROUND-24,Math.min(1,dt*2.5));if(f.inf>=1)f.st='float';break;
    case 'float':{
      f.vx+=((f.tx-f.x)*0.7-f.vx)*Math.min(1,dt*1.1);
      f.x+=(f.vx+Math.sin(f.t*1.3+f.ph)*(f.weave||14))*dt;f.y+=f.vy*dt;f.rot=Math.sin(f.t*1.7+f.ph)*0.08;
      f.throwT-=dt;
      if(f.throwT<=0){f.throwT=rand(3,7)/(1+G.stage*0.12);if(f.x>200&&f.y>110&&f.y<440&&Math.random()<Math.min(0.75,0.32+G.stage*0.07))throwRock(f);}
      if(f.vy>0){if(f.y>=GROUND-16){f.y=GROUND-16;land(f);}}
      else if(f.y<66)escapeFox(f);
    }break;
    case 'fall':f.vy+=900*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;if(f.y>GROUND-8){f.dead=true;dustPoof(f.x,GROUND-4);S.thud();}break;
    case 'land':f.lt-=dt;f.sy=1-0.25*Math.sin(clamp((0.3-f.lt)/0.3,0,1)*Math.PI);f.sx=2-f.sy;if(f.lt<=0){f.st='run';f.sy=f.sx=1;f.rot=0;}break;
    case 'run':f.x+=f.speed*dt;f.y=GROUND-14-Math.abs(Math.sin(f.t*14))*2.5;if(f.x>=LADX-4)startClimb(f);break;
    case 'flee2':f.x+=f.speed*dt;f.y=GROUND-14-Math.abs(Math.sin(f.t*14))*2.5;if(f.x>W+30)f.dead=true;break;
    case 'climb':f.y-=92*dt;f.climbS-=dt;if(f.climbS<=0){f.climbS=0.22;S.climb();}if(f.y<=SLOTS[f.slot]){f.y=SLOTS[f.slot];f.st='perch';}break;
    case 'perch':
      f.lunge=Math.max(0,f.lunge-dt);
      if(f.slot>=0&&G.state==='play'&&G.hurtT<=0&&G.inv<=0&&Math.abs(f.y-(G.gy-24))<32){f.lunge=0.5;S.bite();loseLife('Bitten by a climbing fox!');}
      break;
    case 'hop':{f.ht+=dt/0.8;const k=Math.min(1,f.ht);f.x=lerp(f.hx0,f.hx1,k);f.y=lerp(f.hy0,f.hy1,k)-Math.sin(k*Math.PI)*40;if(k>=1)f.st='sit';}break;
    case 'sit':if(f.cheer)f.cheer=Math.max(0,f.cheer-dt*0.5);break;
    case 'flee':f.x-=170*dt;f.y=80-Math.abs(Math.sin(f.t*12))*4;if(f.x<-30)f.dead=true;break;
  }
}
function segHits(px,py,x,y,fn){for(const s of [0.34,0.67,1]){if(fn(lerp(px,x,s),lerp(py,y,s)))return true;}return false;}
function update(dt){
  G.t+=dt;
  // ambient always runs
  for(const c of G.clouds){c.x+=c.v*dt;if(c.x>W+40)c.x=-240*c.s-20;}
  G.birdT-=dt;if(G.birdT<=0){G.birdT=rand(10,22);const y=rand(110,200),n=3+Math.floor(rand(4));for(let i=0;i<n;i++)G.birds.push({x:-20-i*14,y:y+Math.abs(i-n/2)*8,v:rand(36,44),p:rand(TAU)});}
  G.birds.forEach(b=>{b.x+=b.v*dt;b.p+=dt*9;});G.birds=G.birds.filter(b=>b.x<W+30);
  for(const m of G.motes){m.p+=dt*m.s;m.x+=Math.sin(m.p)*8*dt+6*dt;m.y+=Math.cos(m.p*0.7)*6*dt;if(m.x>W)m.x=0;}
  if(G.paused)return;

  const I=readInput();const fp=I.fire&&!inp.prevFire;inp.prevFire=I.fire;
  if(G.state==='title'){if(fp||G.startReq){G.startReq=false;ensureAudio();newGame();return;}}
  if(G.state==='over'){G.overT+=dt;if((fp||G.startReq)&&G.overT>1.2){G.startReq=false;newGame();return;}G.startReq=false;}

  G.cd-=dt;G.triple=Math.max(0,G.triple-dt);G.inv=Math.max(0,G.inv-dt);G.bannerT=Math.max(0,G.bannerT-dt);
  G.shake*=Math.exp(-dt*7);if(G.shake<0.2)G.shake=0;G.flash=Math.max(0,G.flash-dt*1.6);

  if(G.state==='title')demoAI(dt);
  else if(G.state==='play'||G.state==='clear')controlPlayer(I.ax,inp.targetY,I.fire,dt);
  // ear springs
  for(let i=0;i<2;i++){const push=-G.gv*0.028*(i?0.8:1);G.ear[i*2+1]+=(-(G.ear[i*2])*70-G.ear[i*2+1]*5+push)*dt;G.ear[i*2]+=G.ear[i*2+1]*dt;G.ear[i*2]=clamp(G.ear[i*2],-0.7,0.7);}

  if(G.hurtT>0){G.hurtT-=dt;if(G.hurtT<=0)afterHurt();}

  // spawning
  if((G.state==='play'&&G.bannerT<1.4)||G.state==='title'){
    G.spawnT-=dt;
    const active=G.foxes.filter(f=>f.st==='float'||f.st==='prep'||f.st==='rise0').length;
    const maxA=Math.min(13,7+G.stage);
    if(G.spawnT<=0&&(G.demo||G.spawned<G.quota)&&active<maxA&&G.hurtT<=0){const rem=G.demo?99:G.quota-G.spawned;const form=Math.random()<Math.min(0.88,0.58+G.stage*0.07)?pickForm(rem):null;
      let n=1,gap=1;if(form){n=spawnGroup(form);gap=1.7+n*0.25;}else spawnFox();
      if(!G.demo)G.spawned+=n;G.spawnT=Math.max(0.5,2.0-G.stage*0.15)*rand(0.7,1.2)*gap;}
    if(!G.demo){G.bubbleT-=dt;if(G.bubbleT<=0&&!G.bubble){G.bubbleT=rand(18,28);
      if(G.foxes.some(f=>f.st==='perch'))G.bubble={x:170,y:rand(150,360),t:0,kind:'gust'};else G.bubbleT=rand(4,8);}}
  }
  if(G.boulderT>0){G.boulderT-=dt;if(G.boulderT<=0&&G.state==='play')launchBoulder();}

  G.foxes.forEach(f=>updateFox(f,dt));
  // arrows
  for(const a of G.arrows){
    a.t+=dt;
    if(a.st==='bounce'){a.vy+=900*dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.rot+=14*dt;if(a.y>GROUND||a.t>2)a.dead=true;continue;}
    if(a.st==='drop'){
      const py0=a.y;a.y+=a.vy*dt;
      addP({x:a.x,y:a.y-10,vx:0,vy:0,g:0,life:0.2,max:0.2,size:1.8,col:'rgba(160,240,255,0.9)',type:'dot',add:true,rot:0,vr:0,drag:0});
      for(const s2 of [0.25,0.5,0.75,1]){const y=lerp(py0,a.y,s2);
        for(const f of G.foxes){if(!shootable(f))continue;const bl=balloonsOf(f);
          for(let i=bl.length-1;i>=0;i--){const b=bl[i];if(((a.x-b.x)/(21*b.s+2))**2+((y-b.y)/(25*b.s+2))**2<1){popBalloon(f,i,a);break;}}}
        for(const r of G.rocks)if(!r.dead&&(a.x-r.x)**2+(y-r.y)**2<(r.r+5)**2){r.dead=true;S.crack();addScore(50,r.x,r.y);}
      }
      if(a.y>GROUND-2){a.dead=true;dustPoof(a.x,GROUND-2,3);}
      continue;
    }
    const px=a.x,py=a.y;a.x+=a.vx*dt;a.y+=a.vy*dt;
    if(a.t%0.03<dt)addP({x:a.x+8,y:a.y,vx:0,vy:0,g:0,life:0.18,max:0.18,size:1.6,col:'rgba(255,240,200,0.8)',type:'dot',add:true,rot:0,vr:0,drag:0});
    let hit=false;
    for(const s of [0.25,0.5,0.75,1]){
      const x=lerp(px,a.x,s),y=lerp(py,a.y,s);
      for(const f of G.foxes){
        if(!shootable(f))continue;
        if(f.shield&&(x-f.x-19)**2+(y-f.y+40)**2<17*17){
          a.st='bounce';a.x=x;a.y=y;a.vx=rand(140,240);a.vy=-rand(140,240);f.flinch=0.2;
          tone({type:'triangle',f:190,f2:120,dur:0.09,v:0.25});noise({dur:0.06,v:0.25,filt:'bandpass',ff:900,q:2});
          burst(x,y,6,{type:'rock',col:['#c08a4e','#7a4e2a'],s0:40,s1:150,g:500,l0:0.3,l1:0.5,z0:1.5,z1:3});
          if(!G.demo)popup(x,y-10,'SHIELD','#ffd0b0',12);hit=true;break;}
        const bl=balloonsOf(f);let bi=-1;
        for(let i=bl.length-1;i>=0;i--){const b=bl[i];const rx=21*b.s+2,ry=25*b.s+2;if(((x-b.x)/rx)**2+((y-b.y)/ry)**2<1){bi=i;break;}}
        if(bi>=0){const b=bl[bi];popBalloon(f,bi,a);hit=true;
          if(y>b.y+8*b.s){a.st='drop';a.x=b.x;a.y=y+4;a.vx=0;a.vy=820;a.t=0;tone({f:1800,f2:900,dur:0.12,v:0.08});
            if(!G.demo)popup(b.x+26,b.y+16,'DROP','#9ff3ff',12);}
          else a.dead=true;
          break;}
        if(((x-f.x-3)/15)**2+((y-f.y+4)/24)**2<1){
          a.st='bounce';a.x=x;a.y=y;a.vx=rand(120,220);a.vy=-rand(120,220);S.tink();f.flinch=0.25;
          burst(x,y,6,{col:'#fff6d0',add:true,s0:40,s1:140,g:0,l0:0.15,l1:0.3,z0:1,z1:2});
          if(!G.demo)popup(x,y-10,'BLOCKED','#ffd0b0',12);hit=true;break;}
      }
      if(hit)break;
    }
    if(a.st!=='fly'||a.dead)continue;
    for(const r of G.rocks){if(!r.dead&&segHits(px,py,a.x,a.y,(x,y)=>(x-r.x)**2+(y-r.y)**2<(r.r+6)**2)){r.dead=true;a.dead=true;S.crack();
      burst(r.x,r.y,10,{type:'rock',col:['#8a7d70','#6a5e54','#b0a394'],s0:60,s1:200,g:600,l0:0.4,l1:0.8,z0:2,z1:4,drag:0.8});addScore(50,r.x,r.y,'#e6dccf');break;}}
    if(a.dead)continue;
    const B=G.boulder;
    if(B&&segHits(px,py,a.x,a.y,(x,y)=>(x-B.x)**2+(y-B.y)**2<B.r*B.r)){a.dead=true;B.hp--;S.chip();G.shake=Math.max(G.shake,3);
      burst(a.x,a.y,8,{type:'rock',col:['#a89a8a','#6a5e54'],s0:60,s1:180,g:500,l0:0.3,l1:0.6,z0:2,z1:4});if(B.hp<=0)endBoulder(true);continue;}
    const P=G.bubble;
    if(P&&segHits(px,py,a.x,a.y,(x,y)=>(x-P.x)**2+(y-P.y)**2<28*28)){a.dead=true;collectBubble();continue;}
    if(a.x<-40||a.y<-40||a.y>H+40)a.dead=true;
  }
  updateMeat(dt);
  // rocks
  for(const r of G.rocks){
    if(r.dead)continue;r.vy+=r.g*dt;r.x+=r.vx*dt;r.y+=r.vy*dt;r.rot+=r.vr*dt;
    if((r.x-GX)**2+(r.y-(G.gy-20))**2<30*30&&G.hurtT<=0){
      r.dead=true;burst(r.x,r.y,10,{type:'rock',col:['#8a7d70','#6a5e54'],s0:60,s1:200,g:600,l0:0.4,l1:0.8,z0:2,z1:4});
      if(!G.demo&&G.inv<=0&&G.state==='play'){S.crack();loseLife('Hit by a rock!');}
    }
    if(r.y>GROUND||r.x>W+30){r.dead=true;dustPoof(r.x,GROUND-2,4);}
  }
  // boulder
  if(G.boulder){const b=G.boulder;b.vy+=b.g*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.vx*dt/b.r;
    if(G.t%0.05<dt)dustPoof(b.x-b.r*0.6,b.y,1);
    if((b.x-GX)**2+(b.y-(G.gy-20))**2<(b.r+26)**2){endBoulder(false);loseLife('Flattened by the boulder!');}
    else if(b.y>GROUND||b.x>W+40)endBoulder(false);}
  // bubble
  if(G.bubble){const b=G.bubble;b.t+=dt;b.x+=38*dt;b.y+=Math.sin(b.t*2)*18*dt;if(b.t>15||b.x>760){burst(b.x,b.y,10,{col:'#dff8ff',add:true,s0:30,s1:90,g:0});G.bubble=null;}}
  // loose balloons
  for(const l of G.loose){l.y+=l.vy*dt;l.x+=Math.sin(G.t*1.5+l.ph)*12*dt;l.life-=dt;}
  G.loose=G.loose.filter(l=>l.life>0&&l.y>-60);
  // particles
  for(const p of G.parts){p.life-=dt;p.vx*=Math.exp(-p.drag*dt);p.vy*=Math.exp(-p.drag*dt);p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;if(p.grow)p.size+=p.grow*dt;}
  G.parts=G.parts.filter(p=>p.life>0);
  for(const p of G.pops){p.t-=dt;p.y-=34*dt;}G.pops=G.pops.filter(p=>p.t>0);
  G.arrows=G.arrows.filter(a=>!a.dead);G.rocks=G.rocks.filter(r=>!r.dead);
  G.foxes=G.foxes.filter(f=>!f.dead);
  G.slots=G.slots.map(s=>s&&G.foxes.includes(s)&&(s.st==='perch'||s.st==='climb')?s:null);

  if(G.state==='play'&&G.hurtT<=0&&G.spawned>=G.quota){
    const busy=!!G.thrown||G.arrows.some(a=>a.st==='drop')||G.foxes.some(f=>['prep','rise0','float','land','run','climb','hop','fall'].includes(f.st));
    if(!busy&&!G.rocks.length&&!G.boulder&&G.boulderT<=0)stageClear();
  }
  if(G.state==='clear'){G.clearT-=dt;if(G.clearT<=0){G.stage++;startStage();M.int=1;}}
}

/* ================= drawing ================= */
function ell(x,y,rx,ry,r=0){ctx.beginPath();ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),r,0,TAU);}
function txt(s,x,y,o={}){
  const {font='display',size=24,weight='',color='#fff',align='left',base='alphabetic',stroke=null,sw=0,shadow=true,ls=0,alpha=1}=o;
  ctx.save();ctx.globalAlpha*=alpha;
  ctx.font=font==='display'?`${size}px "Lilita One","Trebuchet MS",sans-serif`:`${weight||800} ${size}px "Nunito",system-ui,sans-serif`;
  ctx.textAlign=align;ctx.textBaseline=base;if('letterSpacing' in ctx)ctx.letterSpacing=ls+'px';
  if(shadow){ctx.fillStyle='rgba(12,8,30,0.5)';ctx.fillText(s,x+1.5,y+2.5);}
  if(stroke){ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.strokeText(s,x,y);}
  ctx.fillStyle=color;ctx.fillText(s,x,y);ctx.restore();
}
function drawBalloon(b,wob){
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(wob);ctx.scale(b.s,b.s);
  const h=b.hue;
  const g=ctx.createRadialGradient(-7,-10,2,0,0,28);
  g.addColorStop(0,`hsl(${h},95%,82%)`);g.addColorStop(0.35,`hsl(${h},85%,60%)`);g.addColorStop(1,`hsl(${h},80%,32%)`);
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,25);
  ctx.bezierCurveTo(-14,22,-22,8,-21,-4);ctx.bezierCurveTo(-20,-18,-10,-26,0,-26);ctx.bezierCurveTo(10,-26,20,-18,21,-4);ctx.bezierCurveTo(22,8,14,22,0,25);ctx.fill();
  ctx.fillStyle=`hsl(${h},80%,34%)`;ctx.beginPath();ctx.moveTo(0,24);ctx.lineTo(-3.5,30);ctx.lineTo(3.5,30);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.65)';ell(-8,-12,4.5,8,-0.5);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.35)';ell(9,10,2,4,0.4);ctx.fill();

}
function drawString(x1,y1,x2,y2,sw){ctx.strokeStyle='rgba(250,245,235,0.75)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo((x1+x2)/2+sw*6,(y1+y2)/2,x2,y2);ctx.stroke();}
function drawFox(f){
  const c=f.coat,pose=f.st;
  ctx.save();ctx.translate(f.x-(f.lunge?Math.sin(f.lunge*TAU*2)*8:0)-(f.flinch?f.flinch*12:0),f.y);ctx.rotate((f.rot||0)-(f.flinch||0)*0.8);ctx.scale(f.sx||1,f.sy||1);
  const sw=Math.sin(f.t*3+f.ph);
  const fur=(x,y,rx,ry)=>{const g=ctx.createLinearGradient(x-rx,y-ry,x+rx,y+ry);g.addColorStop(0,c.main);g.addColorStop(1,c.dark);ctx.fillStyle=g;ell(x,y,rx,ry);ctx.fill();};
  const sitting=pose==='sit'||pose==='flee';
  // tail
  ctx.save();ctx.translate(-9,sitting?10:6);ctx.rotate((pose==='run'||pose==='flee2'?1.9:sitting?2.4:0.7)+sw*0.25);
  fur(0,15,7.5,17);ctx.fillStyle=c.light;ell(0,28,5,6);ctx.fill();ctx.restore();
  // legs
  ctx.strokeStyle=c.ear;ctx.lineCap='round';ctx.lineWidth=4.2;ctx.beginPath();
  if(pose==='run'||pose==='flee2'||pose==='flee'){const k=Math.sin(f.t*18);ctx.moveTo(-3,11);ctx.lineTo(-3-k*7,22);ctx.moveTo(5,11);ctx.lineTo(5+k*7,22);}
  else if(pose==='climb'||pose==='perch'){const k=pose==='climb'?Math.sin(f.t*12):0;ctx.moveTo(-2,11);ctx.lineTo(6,18+k*4);ctx.moveTo(5,11);ctx.lineTo(12,16-k*4);}
  else if(sitting){ctx.moveTo(-4,12);ctx.lineTo(4,16);ctx.moveTo(4,12);ctx.lineTo(12,16);}
  else{ctx.moveTo(-4,11);ctx.lineTo(-6+sw*5,25);ctx.moveTo(5,11);ctx.lineTo(6-sw*5,26);}
  ctx.stroke();
  // body
  fur(0,2,12,15);ctx.fillStyle=c.light;ell(4,4,6,9.5);ctx.fill();
  // arms
  ctx.strokeStyle=c.dark;ctx.lineWidth=4;ctx.beginPath();
  if(pose==='float'||pose==='prep'||pose==='rise0'){
    if(f.arm>0){ctx.moveTo(2,-6);ctx.lineTo(1,-26);ctx.moveTo(6,-4);ctx.lineTo(16+Math.sin(f.arm*8)*6,-12);}
    else{ctx.moveTo(-1,-6);ctx.lineTo(0,-26);ctx.moveTo(5,-6);ctx.lineTo(3,-26);}
  }else if(pose==='climb'||pose==='perch'){ctx.moveTo(3,-6);ctx.lineTo(14,-14);ctx.moveTo(6,-2);ctx.lineTo(14,-2);}
  else if(sitting){const wv=f.cheer?Math.sin(G.t*16)*6:Math.sin(G.t*3+f.ph)*3;ctx.moveTo(4,-4);ctx.lineTo(12,-18+wv);}
  else if(pose==='fall'){ctx.moveTo(0,-6);ctx.lineTo(-12,-16);ctx.moveTo(5,-6);ctx.lineTo(16,-16);}
  else{const k=Math.sin(f.t*18);ctx.moveTo(3,-4);ctx.lineTo(10+k*5,4);}
  ctx.stroke();
  // head
  ctx.save();ctx.translate(6,-18);
  ctx.fillStyle=c.main;ctx.beginPath();ctx.moveTo(-9,-6);ctx.lineTo(-6,-21);ctx.lineTo(1,-9);ctx.fill();ctx.beginPath();ctx.moveTo(1,-9);ctx.lineTo(8,-20);ctx.lineTo(10,-5);ctx.fill();
  ctx.fillStyle=c.ear;ctx.beginPath();ctx.moveTo(-7,-9);ctx.lineTo(-6,-17);ctx.lineTo(-2,-10);ctx.fill();ctx.beginPath();ctx.moveTo(3,-9);ctx.lineTo(7.5,-16);ctx.lineTo(8,-8);ctx.fill();
  fur(0,0,12,10.5);
  ctx.fillStyle=c.light;ctx.beginPath();ctx.moveTo(4,-3);ctx.quadraticCurveTo(14,-2,19,3);ctx.quadraticCurveTo(12,8,2,7);ctx.closePath();ctx.fill();
  ctx.fillStyle='#1b0f0a';ell(19,2.5,2.4,2);ctx.fill();
  if(c.mask){ctx.fillStyle='rgba(20,8,8,0.75)';ctx.beginPath();ctx.moveTo(-5,-6);ctx.quadraticCurveTo(5,-9,12,-5);ctx.lineTo(11,-1);ctx.quadraticCurveTo(4,-4,-5,-1);ctx.closePath();ctx.fill();}
  if(pose==='fall'){ctx.strokeStyle='#1b0f0a';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(4,-6);ctx.lineTo(8,-2);ctx.moveTo(8,-6);ctx.lineTo(4,-2);ctx.stroke();}
  else{ctx.fillStyle='#fff';ell(6.5,-3.5,3,3.2);ctx.fill();ctx.fillStyle='#1b0f0a';ell(7.5,-3.3,1.7,2.1);ctx.fill();ctx.fillStyle='#fff';ell(8,-4.2,0.6,0.6);ctx.fill();
    ctx.strokeStyle='#1b0f0a';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(3,-8);ctx.lineTo(10,-6.5);ctx.stroke();
    if(pose==='perch'||f.lunge){ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(12,5);ctx.lineTo(13,8);ctx.lineTo(14,5);ctx.fill();}}
  ctx.restore();
  ctx.restore();
}
function drawShield(f){
  const x=f.x+19,y=f.y-40,c=f.coat;
  ctx.strokeStyle=c.dark;ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(f.x+6,f.y-6);ctx.lineTo(x-4,y+8);ctx.stroke();

  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,16,0,TAU);ctx.fill();

  ctx.strokeStyle='rgba(60,30,10,0.5)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-16,-5);ctx.lineTo(16,-5);ctx.moveTo(-16,5);ctx.lineTo(16,5);ctx.stroke();
  ctx.fillStyle='#c9ced6';ctx.beginPath();ctx.arc(0,0,4.5,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.6)';ctx.beginPath();ctx.arc(-1.2,-1.4,1.6,0,TAU);ctx.fill();
  ctx.restore();
}
function drawFoxWithBalloons(f){
  const bl=balloonsOf(f);const sw=Math.sin(f.t*1.7+f.ph);

function drawHare(x,y){
  const hurt=G.hurtT>0;const bob=Math.sin(G.t*2.4)*1.2,by=y+bob;
  const furG=(x0,y0,rx,ry)=>{const g=ctx.createRadialGradient(x0-rx*0.4,y0-ry*0.5,1,x0,y0,Math.max(rx,ry)*1.2);g.addColorStop(0,'#fbf6ee');g.addColorStop(1,'#bfb1a0');return g;};
  const ear=(px,py,ang,len,dark)=>{ctx.save();ctx.translate(px,py);ctx.rotate(ang);ctx.fillStyle=dark?'#cdbfae':furG(0,-len/2,6.5,len/2);ell(0,-len/2,6.5,len/2);ctx.fill();
    ctx.fillStyle=dark?'#d99a9a':'#f2aeb3';ell(0.6,-len/2+3,3,len/2-6);ctx.fill();ctx.restore();};
  // back ear

  ctx.fillStyle='#fff';ctx.globalAlpha=0.8;ctx.fillRect(x+18,by-31+fl*0.6,3,4);ctx.globalAlpha=1;
  // head
  ctx.fillStyle=furG(x-6,by-46,17,15);ell(x-6,by-46,17,15,-0.12);ctx.fill();
  ctx.fillStyle='#fffaf3';ell(x-19,by-41,8.5,6.5);ctx.fill();
  ctx.fillStyle='#f08a96';ell(x-26.5,by-44,2.8,2.2);ctx.fill();
  ctx.strokeStyle='rgba(120,90,80,0.6)';ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(x-22,by-41);ctx.lineTo(x-34,by-43);ctx.moveTo(x-22,by-39);ctx.lineTo(x-33,by-38);ctx.stroke();
  ctx.fillStyle='rgba(255,140,150,0.35)';ell(x-11,by-39,4.5,3);ctx.fill();

  ctx.fillStyle='rgba(255,255,255,0.75)';ctx.fillRect(x-8,by-35,3,4);ctx.fillRect(x+2,by-35,3,4);
  // front ear

  const sx=(Math.random()-0.5)*G.shake,sy=(Math.random()-0.5)*G.shake;
  ctx.save();ctx.translate(sx,sy);
  ctx.drawImage(L.fg,0,0,W,H);
  // aim guide
  if((G.state==='play'||G.state==='clear')&&G.hurtT<=0){ctx.save();ctx.setLineDash([4,8]);ctx.strokeStyle='rgba(255,245,220,0.22)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(GX-56,G.gy-AIM);ctx.lineTo(GX-260,G.gy-AIM);ctx.stroke();ctx.restore();}
  for(const f of G.foxes)if(f.st==='sit'||f.st==='flee'||f.st==='hop')drawFox(f);
  for(const f of G.foxes)if(f.st==='climb'||f.st==='perch')drawFox(f);
  for(const l of G.loose){ctx.save();ctx.globalAlpha=Math.min(1,l.life);drawString(l.x,l.y+29,l.x+Math.sin(G.t*3+l.ph)*6,l.y+60,Math.sin(G.t*2+l.ph));drawBalloon({x:l.x,y:l.y,s:1,hue:l.hue},Math.sin(G.t*2+l.ph)*0.1);ctx.restore();}
  ctx.save();ctx.beginPath();ctx.rect(-20,-300,W+40,GROUND+314);ctx.clip();for(const f of G.foxes)if(['float','prep','rise0'].includes(f.st))drawFoxWithBalloons(f);ctx.restore();
  for(const f of G.foxes){if(false);else if(['fall','land','run','flee2'].includes(f.st))drawFox(f);}
  for(const r of G.rocks)drawRock(r,false);
  if(G.boulder)drawRock(G.boulder,true);
  if(G.bubble)drawBubble(G.bubble);
  for(const a of G.arrows){const ang=a.st==='bounce'?a.rot:Math.atan2(a.vy,a.vx)+Math.PI;
    if(a.st==='drop'){ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle='rgba(160,240,255,0.55)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a.x,a.y-6);ctx.lineTo(a.x,a.y-70);ctx.stroke();ctx.restore();}
    if(a.st==='fly'){ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createLinearGradient(a.x,a.y,a.x+60,a.y);g.addColorStop(0,'rgba(255,230,170,0.5)');g.addColorStop(1,'rgba(255,230,170,0)');ctx.strokeStyle=g;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(a.x-a.vx*0.06,a.y-a.vy*0.06);ctx.stroke();ctx.restore();}
    drawArrowShape(a.x,a.y,ang);}
  drawLift();
  drawMeatLayer();
  ctx.drawImage(L.bush,0,0,W,H);
  drawParticles(false);
  if(T.tint){ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=0.85;ctx.fillStyle=T.tint;ctx.fillRect(-20,-20,W+40,H+40);ctx.restore();}
  if(T.stars){ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<18;i++){const x=200+((i*97+G.t*12*(i%3+1))%560),y=300+Math.sin(G.t*0.7+i)*80+(i*23)%100,a=0.5+0.5*Math.sin(G.t*3+i*1.7);
    const g=ctx.createRadialGradient(x,y,0,x,y,7);g.addColorStop(0,`rgba(220,255,140,${0.7*a})`);g.addColorStop(1,'rgba(220,255,140,0)');ctx.fillStyle=g;ctx.fillRect(x-7,y-7,14,14);}ctx.restore();}
  drawParticles(true);
  for(const p of G.pops){const a=Math.min(1,p.t*2);txt(p.text,p.x,p.y,{size:p.size,color:p.col,align:'center',stroke:'rgba(40,15,40,0.6)',sw:4,shadow:false,alpha:a});}
  ctx.restore();
  ctx.drawImage(L.vig,0,0,W,H);
  if(G.flash>0){ctx.fillStyle=`rgba(${G.flashCol},${G.flash*0.35})`;ctx.fillRect(0,0,W,H);}
  drawHUD();drawOverlays();
}

/* ================= loop ================= */
let last=0;
function step(t){const dt=Math.min(0.05,Math.max(0,(t-last)/1000));last=t;update(dt);draw();}
function loop(t){if(XR.active)return;requestAnimationFrame(loop);step(t);}

/* ================= WebXR (Meta Quest) ================= */
const XR={active:false,session:null,gl:null,ref:null,loc:{},tex:null,reticles:[],savedK:1};
const QZ=-2.2,QHW=1.6,QHH=0.9;
async function checkXR(){if(!navigator.xr)return;try{if(await navigator.xr.isSessionSupported('immersive-vr'))document.getElementById('bVR').hidden=false;}catch(e){}}
async function enterVR(){
  ensureAudio();
  try{const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});await startXR(s);}
  catch(e){toast('VR could not start inside this frame. On Quest, open the page by itself in the Quest Browser and press Enter VR.');}
}
async function startXR(s){
  const c=document.createElement('canvas');const gl=c.getContext('webgl',{xrCompatible:true,antialias:true,alpha:false});
  if(gl.makeXRCompatible)await gl.makeXRCompatible();
  s.updateRenderState({baseLayer:new XRWebGLLayer(s,gl)});
  XR.ref=await s.requestReferenceSpace('local');
  const sh=(type,src)=>{const o=gl.createShader(type);gl.shaderSource(o,src);gl.compileShader(o);return o;};
  const prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,'attribute vec3 p;attribute vec2 u;uniform mat4 P;uniform mat4 V;varying vec2 v;void main(){v=u;gl_Position=P*V*vec4(p,1.0);}'));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,'precision mediump float;varying vec2 v;uniform sampler2D t;uniform float a;void main(){gl_FragColor=vec4(texture2D(t,v).rgb*a,1.0);}'));
  gl.linkProgram(prog);gl.useProgram(prog);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  const fr=0.06;
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
    -QHW,QHH,QZ,0,0, -QHW,-QHH,QZ,0,1, QHW,QHH,QZ,1,0, QHW,-QHH,QZ,1,1,
    -QHW-fr,QHH+fr,QZ-0.01,0.5,0.02, -QHW-fr,-QHH-fr,QZ-0.01,0.5,0.02, QHW+fr,QHH+fr,QZ-0.01,0.5,0.02, QHW+fr,-QHH-fr,QZ-0.01,0.5,0.02]),gl.STATIC_DRAW);
  const lp=gl.getAttribLocation(prog,'p'),lu=gl.getAttribLocation(prog,'u');
  gl.enableVertexAttribArray(lp);gl.enableVertexAttribArray(lu);gl.vertexAttribPointer(lp,3,gl.FLOAT,false,20,0);gl.vertexAttribPointer(lu,2,gl.FLOAT,false,20,12);
  XR.loc={P:gl.getUniformLocation(prog,'P'),V:gl.getUniformLocation(prog,'V'),a:gl.getUniformLocation(prog,'a')};
  XR.tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,XR.tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.enable(gl.DEPTH_TEST);
  XR.gl=gl;XR.session=s;XR.active=true;XR.savedK=K;setK(1.6);
  s.addEventListener('end',()=>{XR.active=false;XR.session=null;XR.reticles=[];inp.xrAxis=0;inp.xrFire=false;inp.xrTarget=null;K=0;resize();last=performance.now();requestAnimationFrame(loop);});
  last=performance.now();s.requestAnimationFrame(xrFrame);
}
function xrFrame(t,frame){
  const s=frame.session;s.requestAnimationFrame(xrFrame);
  inp.xrAxis=0;inp.xrFire=false;inp.xrTarget=null;XR.reticles=[];
  for(const src of s.inputSources){
    const gp=src.gamepad;let trig=false,grip=false;
    if(gp){const ay=(gp.axes.length>=4?gp.axes[3]:gp.axes[1])||0;if(Math.abs(ay)>0.25){inp.xrAxis+=ay;inp.last='pad';}
      trig=!!(gp.buttons[0]&&gp.buttons[0].pressed);grip=!!(gp.buttons[1]&&gp.buttons[1].pressed);
      if(trig||(gp.buttons[4]&&gp.buttons[4].pressed)||(gp.buttons[5]&&gp.buttons[5].pressed)){inp.xrFire=true;inp.last='pad';}}
    const pose=frame.getPose(src.targetRaySpace,XR.ref);
    if(pose){const m=pose.transform.matrix,ox=m[12],oy=m[13],oz=m[14],dx=-m[8],dy=-m[9],dz=-m[10];
      if(dz<-0.01){const tt=(QZ-oz)/dz,hx=ox+dx*tt,hy=oy+dy*tt;const gx=(hx+QHW)/(2*QHW)*W,gy=(QHH-hy)/(2*QHH)*H;
        if(gx>-40&&gx<W+40&&gy>-40&&gy<H+40){XR.reticles.push({x:gx,y:gy});if((trig||grip)&&gx<W*0.8)inp.xrTarget=gy+AIM;}}}
  }
  step(t);
  const gl=XR.gl,lay=s.renderState.baseLayer;
  gl.bindFramebuffer(gl.FRAMEBUFFER,lay.framebuffer);gl.clearColor(0.03,0.035,0.08,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.bindTexture(gl.TEXTURE_2D,XR.tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
  const vp=frame.getViewerPose(XR.ref);if(!vp)return;
  for(const view of vp.views){const v=lay.getViewport(view);gl.viewport(v.x,v.y,v.width,v.height);
    gl.uniformMatrix4fv(XR.loc.P,false,view.projectionMatrix);gl.uniformMatrix4fv(XR.loc.V,false,view.transform.inverse.matrix);
    gl.uniform1f(XR.loc.a,0.35);gl.drawArrays(gl.TRIANGLE_STRIP,4,4);
    gl.uniform1f(XR.loc.a,1.0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
}

/* ================= UI chrome ================= */
let toastT=null;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,4200);}
function togglePause(){if(G.state==='play'||G.state==='clear'||G.paused){G.paused=!G.paused;inp.prevFire=true;}}
function toggleFS(){try{if(document.fullscreenElement)document.exitFullscreen();else (document.documentElement.requestFullscreen?.()||Promise.reject()).catch(()=>toast('Fullscreen is not available here.'));}catch(e){toast('Fullscreen is not available here.');}}
document.getElementById('bPause').onclick=()=>{ensureAudio();togglePause();cv.focus();};
document.getElementById('bSound').onclick=()=>{ensureAudio();setMute(!A.muted);cv.focus();};
document.getElementById('bFull').onclick=()=>{toggleFS();cv.focus();};
document.getElementById('bVR').onclick=enterVR;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!XR.active&&(G.state==='play'||G.state==='clear')&&!G.paused)G.paused=true;});
addEventListener('resize',resize);document.addEventListener('fullscreenchange',()=>setTimeout(resize,50));
setMute(A.muted);

/* ================= boot ================= */
G.gy=300;toTitle();resize();
for(let i=0;i<60;i++)update(1/30);
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('40px "Lilita One"'),document.fonts.load('800 16px "Nunito"')]).catch(()=>{});}
checkXR();
requestAnimationFrame(t=>{last=t;loop(t);});
})();
</script>
