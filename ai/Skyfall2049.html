<script>
'use strict';
// ============================================================ CORE
const W=540,H=960,SCROLL=70,STAGE_LEN=96;
const TAU=Math.PI*2,PI=Math.PI;
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d;};
const turnTo=(a,b,m)=>a+clamp(angDiff(a,b),-m,m);
const DISP='"Chakra Petch","Segoe UI",system-ui,sans-serif', MONO='"Share Tech Mono",ui-monospace,monospace';
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255];}
function shade(h,a){const[r,g,b]=hex2rgb(h);return`rgb(${clamp(r+a,0,255)|0},${clamp(g+a,0,255)|0},${clamp(b+a,0,255)|0})`;}
function poly(g,p){g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();}
function mirror(h){const o=[...h];for(let i=h.length-4;i>=2;i-=2)o.push(-h[i],h[i+1]);return o;}
function rrect(g,x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);}
const fmt=n=>String(Math.floor(n)).padStart(8,'0');
let SETTINGS={auto:false,sound:true,diff:1};
const DIFFS=[{n:'NORMAL',d:0,dmg:1,bombs:2,shoot:.3,fill:3,extra:0,roll:1.8,inv:.9},{n:'HARD',d:.45,dmg:1.35,bombs:1,shoot:.6,fill:5,extra:.45,roll:2.2,inv:.7},{n:'ACE',d:1,dmg:1.75,bombs:1,shoot:.85,fill:7,extra:.75,roll:2.6,inv:.55}];
const DF=()=>DIFFS[SETTINGS.diff]||DIFFS[1];
try{const s=JSON.parse(localStorage.getItem('skyfall2049.settings')||'null');if(s)SETTINGS=Object.assign(SETTINGS,s);}catch(e){}
function saveSettings(){try{localStorage.setItem('skyfall2049.settings',JSON.stringify(SETTINGS));}catch(e){}}

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function resize(){const wr=document.getElementById('wrap');const s=Math.min(wr.clientWidth/W,wr.clientHeight/H);const d=Math.min(2,window.devicePixelRatio||1);
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.width=Math.floor(W*s*d);cv.height=Math.floor(H*s*d);}
addEventListener('resize',resize);resize();

// ============================================================ SPRITES
function mk(w,h,fn,s=2){const c=document.createElement('canvas');c.width=Math.ceil(w*s);c.height=Math.ceil(h*s);const g=c.getContext('2d');g.scale(s,s);g.translate(w/2,h/2);fn(g,w,h);c.w=w;c.h=h;return c;}
function silhouette(src,a=.5){const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const g=c.getContext('2d');g.filter='blur(3px)';g.drawImage(src,0,0);g.filter='none';g.globalCompositeOperation='source-in';g.fillStyle=`rgba(0,14,30,${a})`;g.fillRect(0,0,c.width,c.height);c.w=src.w;c.h=src.h;return c;}
function blit(s,x,y,ang=0,sx=1,sy=sx,alpha=1){ctx.save();ctx.translate(x,y);if(ang)ctx.rotate(ang);if(sx!==1||sy!==1)ctx.scale(sx,sy);if(alpha!==1)ctx.globalAlpha*=alpha;ctx.drawImage(s,-s.w/2,-s.h/2,s.w,s.h);ctx.restore();}
function canopy(g,x,y,rx,ry,c1='#fff4c8',c2='#e0a03a',c3='#4a2206'){const gr=g.createLinearGradient(x,y-ry,x,y+ry);gr.addColorStop(0,c1);gr.addColorStop(.45,c2);gr.addColorStop(1,c3);g.fillStyle=gr;g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fill();g.fillStyle='rgba(255,255,255,.7)';g.beginPath();g.ellipse(x-rx*.3,y-ry*.35,rx*.28,ry*.4,0,0,TAU);g.fill();}
function hgrad(g,x0,x1,a,b,c){const gr=g.createLinearGradient(x0,0,x1,0);gr.addColorStop(0,a);gr.addColorStop(.5,b);gr.addColorStop(1,c);return gr;}
function vgrad(g,y0,y1,a,b){const gr=g.createLinearGradient(0,y0,0,y1);gr.addColorStop(0,a);gr.addColorStop(1,b);return gr;}
const GLOW={};
function glowSpr(c){return GLOW[c]||(GLOW[c]=mk(64,64,g=>{const gr=g.createRadialGradient(0,0,0,0,0,32);gr.addColorStop(0,'#ffffff');gr.addColorStop(.22,c);gr.addColorStop(.55,c+'55');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(-32,-32,64,64);},1));}

  g.fillStyle=accent;poly(g,[14,4,28,11,28,13.5,13,8]);g.fill();poly(g,[-14,4,-28,11,-28,13.5,-13,8]);g.fill();

  g.fillStyle='#141b24';poly(g,[5,-8,9.5,-1,6,2]);g.fill();poly(g,[-5,-8,-9.5,-1,-6,2]);g.fill();

  g.fillStyle='#1b1f26';g.fillRect(-8,19,5,6);g.fillRect(3,19,5,6);
  g.strokeStyle='rgba(20,30,40,.4)';g.beginPath();g.moveTo(-21,10);g.lineTo(-9,0);g.moveTo(21,10);g.lineTo(9,0);g.moveTo(-6,16);g.lineTo(-12,18);g.moveTo(6,16);g.lineTo(12,18);g.stroke();
  g.fillStyle='#ff3040';g.fillRect(-30,10,2,3);g.fillStyle='#30ff70';g.fillRect(28,10,2,3);

  if(stripe){g.fillStyle=stripe;poly(g,[8,0,16,5,14,6,7,2]);g.fill();poly(g,[-8,0,-16,5,-14,6,-7,2]);g.fill();}
  g.fillStyle=shade(body,40);g.beginPath();g.ellipse(0,-2,3.4,7,0,0,TAU);g.fill();
  g.fillStyle=eye;g.beginPath();g.arc(0,-7,1.8,0,TAU);g.fill();
  g.fillStyle='#111';g.fillRect(-2.5,4,5,3);

    g.fillStyle='#c22a2a';poly(g,[11,3,19,7,19,8.5,10,6]);g.fill();poly(g,[-11,3,-19,7,-19,8.5,-10,6]);g.fill();

    g.strokeStyle='rgba(255,220,80,.5)';g.lineWidth=1;g.beginPath();g.moveTo(-108,190);g.lineTo(-40,-100);g.moveTo(-70,215);g.lineTo(6,-82);g.stroke();
    g.strokeStyle='rgba(255,255,255,.4)';g.beginPath();g.moveTo(-22,-246);g.lineTo(-22,-120);g.moveTo(22,-246);g.lineTo(22,-120);g.stroke();
    g.fillStyle='#2c3239';g.fillRect(-70,-10,34,30);g.fillRect(36,140,40,32);
    g.fillStyle=hgrad(g,58,90,'#3e4650','#69747f','#3a424b');rrect(g,58,8,30,112,4);g.fill();

function makeOcean(pal){

  const base=mkc(),hi=mkc(),bg=base.getContext('2d'),hg=hi.getContext('2d');

  {up:['ArrowUp'],down:['ArrowDown'],left:['ArrowLeft'],right:['ArrowRight'],fire:['Enter','NumpadEnter','Numpad0','ControlRight'],roll:['ShiftRight','Period','Numpad1'],bomb:['Slash','NumpadDecimal','Numpad2']}];
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab','Slash'].includes(e.code))e.preventDefault();
  if(!e.repeat)pressed.add(e.code);keys.add(e.code);initAudio();
  if(e.code==='KeyM'&&!e.repeat)toggleSound();if(e.code==='KeyF'&&!e.repeat)toggleFS();});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>{keys.clear();if(G.state==='play')G.paused=true;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play')G.paused=true;});
function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('mousemove',e=>{const p=toLogical(e);if(Math.hypot(p.x-mouse.x,p.y-mouse.y)>3&&!touchMode)mouse.active=true;mouse.x=p.x;mouse.y=p.y;});
cv.addEventListener('mousedown',e=>{if(touchMode)return;initAudio();cv.focus();const p=toLogical(e);mouse.x=p.x;mouse.y=p.y;mouse.btn|=1<<e.button;mouse.pressed.add(e.button);if(e.button===1)e.preventDefault();
  if(G.state==='play'&&!G.paused)mouse.active=true;else uiTap(p);});
addEventListener('mouseup',e=>{mouse.btn&=~(1<<e.button);});
cv.addEventListener('contextmenu',e=>e.preventDefault());
function touchButtons(){const b=[],co=G.players.length>1;
  const add=(pid,x)=>{b.push({pid,act:'roll',x,y:H-160,r:38,label:'ROLL'});b.push({pid,act:'bomb',x,y:H-250,r:32,label:'EMP'});};
  if(co){add(0,62);add(1,W-62);}else add(0,62);b.push({pid:-1,act:'pause',x:W/2,y:96,r:20,label:'II'});return b;}
cv.addEventListener('touchstart',e=>{e.preventDefault();initAudio();touchMode=true;mouse.active=false;
  for(const t of e.changedTouches){const p=toLogical(t);
    if(G.state!=='play'||G.paused){uiTap(p);continue;}
    const hit=touchButtons().find(b=>Math.hypot(b.x-p.x,b.y-p.y)<b.r+10);
    if(hit){if(hit.act==='pause')G.paused=true;else touchAct[hit.pid][hit.act]=true;continue;}
    const pid=G.players.length>1&&p.x>W/2?1:0;touches.set(t.identifier,{pid,x:p.x,y:p.y});touchEdge[pid]=true;}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){const r=touches.get(t.identifier);if(!r)continue;const p=toLogical(t);touchDelta[r.pid].x+=(p.x-r.x)*1.3;touchDelta[r.pid].y+=(p.y-r.y)*1.3;r.x=p.x;r.y=p.y;}},{passive:false});
const tEnd=e=>{for(const t of e.changedTouches)touches.delete(t.identifier);};
cv.addEventListener('touchend',tEnd);cv.addEventListener('touchcancel',tEnd);
const touchHeld=pid=>{for(const r of touches.values())if(r.pid===pid)return true;return false;};
function pollPads(){if(!navigator.getGamepads)return;for(const gp of navigator.getGamepads()){if(!gp)continue;
  const btn=gp.buttons.map(b=>b.pressed||b.value>.5),prev=padState[gp.index]?padState[gp.index].btn:[];
  let set=padEdge.get(gp.index);if(!set){set=new Set();padEdge.set(gp.index,set);}
  btn.forEach((b,i)=>{if(b&&!prev[i])set.add(i);});
  const ay=gp.axes[1]||0,pa=padPrevAxis[gp.index]||{},u=ay<-.6,d=ay>.6;if(u&&!pa.u)set.add(112);if(d&&!pa.d)set.add(113);padPrevAxis[gp.index]={u,d};
  padState[gp.index]={btn,ax:gp.axes};}}
function anyPadEdge(...b){for(const s of padEdge.values())for(const x of b)if(s.has(x))return true;return false;}
function clearEdges(){pressed.clear();mouse.pressed.clear();padEdge.forEach(s=>s.clear());touchEdge=[false,false];touchAct=[{},{}];}
function getInput(p){
  const co=G.players.length>1,I={mx:0,my:0,fire:false,fireEdge:false,roll:false,bomb:false,target:null,touch:false,tdx:0,tdy:0};
  const any=a=>a.some(k=>keys.has(k)),edge=a=>a.some(k=>pressed.has(k));
  for(const s of co?[KB[p.id]]:KB){if(any(s.left))I.mx-=1;if(any(s.right))I.mx+=1;if(any(s.up))I.my-=1;if(any(s.down))I.my+=1;
    if(any(s.fire))I.fire=true;if(edge(s.fire))I.fireEdge=true;if(edge(s.roll))I.roll=true;if(edge(s.bomb))I.bomb=true;}
  I.mx=clamp(I.mx,-1,1);I.my=clamp(I.my,-1,1);if(I.mx&&I.my){I.mx*=.7071;I.my*=.7071;}
  if(I.mx||I.my){if(p.id===0)mouse.active=false;}
  for(const[idx,own]of padOwner){if(own!==p.id)continue;const ps=padState[idx];if(!ps)continue;
    let ax=ps.ax[0]||0,ay=ps.ax[1]||0;const m=Math.hypot(ax,ay);if(m<.2){ax=ay=0;}else{const k=Math.min(1,(m-.2)/.75)/m;ax*=k;ay*=k;}
    const b=ps.btn;if(b[14])ax=-1;if(b[15])ax=1;if(b[12])ay=-1;if(b[13])ay=1;if(ax||ay){I.mx=ax;I.my=ay;if(p.id===0)mouse.active=false;}
    if(b[0]||b[7])I.fire=true;const e=padEdge.get(idx);if(e){if(e.has(0)||e.has(7))I.fireEdge=true;if(e.has(1)||e.has(4)||e.has(5))I.roll=true;if(e.has(2)||e.has(3)||e.has(6))I.bomb=true;}}
  if(p.id===0&&mouse.active&&!touchMode){I.target={x:mouse.x,y:mouse.y};if(mouse.btn&1)I.fire=true;if(mouse.pressed.has(0))I.fireEdge=true;if(mouse.pressed.has(2))I.roll=true;if(mouse.pressed.has(1))I.bomb=true;}
  const td=touchDelta[p.id];if(td.x||td.y){I.touch=true;I.tdx=td.x;I.tdy=td.y;td.x=td.y=0;}
  if(touchHeld(p.id))I.fire=true;if(touchEdge[p.id])I.fireEdge=true;if(touchAct[p.id].roll)I.roll=true;if(touchAct[p.id].bomb)I.bomb=true;
  if(SETTINGS.auto)I.fire=true;
  return I;
}
function menuInput(){let d=0,sel=false,back=false;
  if(pressed.has('ArrowUp')||pressed.has('KeyW')||anyPadEdge(12,112))d=-1;
  if(pressed.has('ArrowDown')||pressed.has('KeyS')||anyPadEdge(13,113))d=1;
  if(['Enter','Space','KeyZ','NumpadEnter'].some(k=>pressed.has(k))||anyPadEdge(0,9))sel=true;
  if(pressed.has('Escape')||pressed.has('Backspace')||anyPadEdge(1))back=true;return{d,sel,back};}
function toggleSound(){SETTINGS.sound=!SETTINGS.sound;saveSettings();if(AU.master)AU.master.gain.setTargetAtTime(SETTINGS.sound?.85:0,AU.ctx.currentTime,.05);}
function toggleFS(){try{if(document.fullscreenElement)document.exitFullscreen();else document.getElementById('wrap').requestFullscreen().catch(()=>{});}catch(e){}}

function setupLook(idx){const st=STAGES[idx%4];G.stageDef=st;G.ocean=makeOcean(st.ocean);
  G.islandSpr=[0,1,2].map(()=>islandSprite(st.island));if(st.island==='ice')G.islandSpr.push(islandSprite('ice',rand(18,34)),islandSprite('ice',rand(22,40)));
  G.cloudSpr=[0,1,2].map(()=>cloudSprite(st.cloud[0],st.cloud[1]));G.bgObjs=[];G.clouds=[];

function setupStage(){const i=(G.stage-1)%4,loop=Math.floor((G.stage-1)/4);
  G.D=1+i*.22+loop*.7+DF().d;G.hpS=1+(G.D-1)*.65;G.fireS=.8+G.D*.24;G.bulS=Math.min(1.6,.92+(G.D-1)*.26);
  setupLook(i);G.stageT=0;G.scriptI=0;G.script=buildScript();G.bossSpawned=false;G.bossTimer=0;G.boss=null;G.wreck=null;G.banner=4.2;G.clearT=0;G.fillT=6;
  G.enemies=[];G.eb=[];G.pickups=[];playSong('stage');}
function buildScript(){const base=[[2,'vee'],[5.5,'snake'],[9,'sweep'],[12,'boats'],[15,'inter'],[18.5,'vee'],[21,'gun'],[25,'destroyer'],[29,'loopers'],[33,'sweep'],[36,'inter'],[40,'snake'],[44,'bomber'],[49,'vee'],[52,'boats'],[55,'loopers'],[58,'gun'],[62,'inter'],[65,'destroyer'],[69,'sweep'],[72,'snake'],[76,'vee'],[79,'gun'],[83,'inter'],[86,'loopers'],[90,'sweep']];
  const light=['vee','snake','sweep','inter','loopers'],out=[];
  for(const[t,w]of base){const ww=light.includes(w)&&Math.random()<.3?pick(light):w;out.push([t,ww]);if(light.includes(ww)&&Math.random()<DF().extra+(G.D>1.6?.2:0))out.push([t+1.6,pick(light)]);}
  const st=G.stageDef.island;if(st==='ice'){out.push([38,'boats'],[60,'boats']);}if(st==='city'){out.push([24,'inter'],[47,'inter'],[74,'gun']);}if(st==='rock'){out.push([31,'gun'],[67,'bomber']);}
  return out.sort((a,b)=>a[0]-b[0]);}
function newPlayer(id){return{id,x:W/2+(id?60:-60),y:H+60,alive:true,out:false,entering:1.2,energy:100,lives:2,bombs:DF().bombs,weapon:'V',level:1,cool:0,mcool:0,roll:0,rollCd:0,inv:3,
  score:0,chain:0,chainT:0,mult:1,wing:0,wx:[W/2,W/2],wy:[H,H],bank:0,respawn:0,col:id?'#ffb43e':'#3ef0ff',trailT:0};}
function startGame(n){G.players=[newPlayer(0)];if(n>1)G.players.push(newPlayer(1));if(n===1)G.players[0].x=W/2;padOwner.clear();
  G.stage=1;G.parts=[];G.pb=[];G.overT=0;G.state='play';G.paused=false;setupStage();sfx('select');}
function toTitle(){G.state='title';G.paused=false;G.players=[];G.enemies=[];G.eb=[];G.pb=[];G.pickups=[];G.boss=null;G.wreck=null;G.warn=0;G.banner=0;G.clearT=0;G.flash=0;G.stage=1;setupLook(0);playSong('title');if(AU.music)AU.music.gain.setTargetAtTime(.5,AU.ctx.currentTime,.1);}
function joinP2(){if(G.state!=='play'||G.players.length>1)return;const p=newPlayer(1);G.players.push(p);sfx('join');popup(W/2,H*.55,'PLAYER 2 JOINED','#ffb43e',22);}
const alive=()=>G.players.filter(p=>p.alive);
function nearestPlayer(x,y){let b=null,bd=1e9;for(const p of G.players){if(!p.alive)continue;const d=(p.x-x)**2+(p.y-y)**2;if(d<bd){bd=d;b=p;}}return b;}
function nearestEnemy(x,y){let b=null,bd=1e9;for(const e of G.enemies){if(e.dead||e.y<-10||e.y>H||e.x<0||e.x>W||e.type==='emissile')continue;const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;b=e;}}return b;}

// ============================================================ PARTICLES & FX
function P(o){if(G.parts.length>1100)return;G.parts.push(Object.assign({x:0,y:0,vx:0,vy:0,life:1,size:4,grow:0,type:'glow',col:'#ffaa44',rot:0,vr:0,drag:0,layer:1,scroll:0},o,{max:o.life||1}));}
function popup(x,y,text,col='#fff',size=16){P({type:'text',x,y,vy:-40,life:1.2,text,col,size,layer:2});}
function explode(x,y,s=1,water=false){
  P({type:'glow',x,y,size:44*s,grow:-30*s,life:.22,col:'#ffe7b0'});
  for(let i=0;i<6*s;i++)P({type:'glow',x:x+rand(-8,8)*s,y:y+rand(-8,8)*s,vx:rand(-90,90)*s,vy:rand(-90,90)*s,size:rand(12,24)*s,grow:-14*s,life:rand(.35,.75),col:pick(['#ff9a2a','#ffcf4a','#ff5a1a']),drag:2.5});
  for(let i=0;i<5*s;i++)P({type:'smoke',x:x+rand(-6,6)*s,y:y+rand(-6,6)*s,vx:rand(-30,30)*s,vy:rand(-30,30)*s,size:rand(10,20)*s,grow:22*s,life:rand(.9,1.8),scroll:water?1:.5,rot:rand(TAU),vr:rand(-1,1),drag:1.2});
  for(let i=0;i<10*s;i++){const a=rand(TAU),v=rand(150,460)*Math.sqrt(s);P({type:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,size:rand(1,2.2),life:rand(.2,.5),col:'#ffd27a',drag:3});}
  if(s>=1.8)P({type:'ring',x,y,size:8*s,grow:340*Math.sqrt(s),life:.45,col:'#ffd8a0',w:6});
  if(s>=1.4)for(let i=0;i<3*s;i++){const a=rand(TAU),v=rand(60,220);P({type:'debris',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,size:rand(3,7),life:rand(.7,1.3),col:'#2a2f36',vr:rand(-12,12),drag:1.5});}
  if(water){for(let i=0;i<10*s;i++){const a=rand(TAU),v=rand(30,110)*s;P({type:'wake',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,size:rand(6,12)*s,grow:12,life:rand(1.2,2.4),scroll:1,layer:0,drag:2});}
    P({type:'ring',x,y,size:10*s,grow:120*s,life:1.2,col:'#ffffff',w:4,scroll:1,layer:0,soft:true});}
  G.shake=Math.max(G.shake,3.5*s);sfx('boom',s);
}
function updParts(dt){const a=G.parts;for(let i=a.length-1;i>=0;i--){const p=a[i];p.life-=dt;if(p.life<=0){a[i]=a[a.length-1];a.pop();continue;}
  if(p.drag){const k=Math.max(0,1-p.drag*dt);p.vx*=k;p.vy*=k;}p.x+=p.vx*dt;p.y+=(p.vy+p.scroll*SCROLL)*dt;p.size=Math.max(0,p.size+p.grow*dt);p.rot+=p.vr*dt;}}
function drawParts(layer){
  ctx.globalCompositeOperation='source-over';
  for(const p of G.parts){if(p.layer!==layer)continue;const k=p.life/p.max;
    if(p.type==='smoke'){ctx.globalAlpha=k*.6;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.drawImage(SPR.smoke,-p.size,-p.size,p.size*2,p.size*2);ctx.restore();}
    else if(p.type==='wake'){ctx.globalAlpha=k*.42;ctx.drawImage(SPR.soft,p.x-p.size,p.y-p.size,p.size*2,p.size*2);}
    else if(p.type==='debris'){ctx.globalAlpha=Math.min(1,k*2);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);ctx.restore();}
    else if(p.type==='text'){ctx.globalAlpha=Math.min(1,k*2.5);txt(p.text,p.x,p.y,p.size,p.col,'center',DISP,700,2,true);}
    else if(p.type==='ring'&&p.soft){ctx.globalAlpha=k*.5;ctx.strokeStyle=p.col;ctx.lineWidth=p.w*k+.5;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.stroke();}}
  ctx.globalCompositeOperation='lighter';
  for(const p of G.parts){if(p.layer!==layer)continue;const k=p.life/p.max;
    if(p.type==='glow'){ctx.globalAlpha=k;ctx.drawImage(glowSpr(p.col),p.x-p.size,p.y-p.size,p.size*2,p.size*2);}
    else if(p.type==='spark'){ctx.globalAlpha=k;ctx.strokeStyle=p.col;ctx.lineWidth=p.size;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);ctx.stroke();}
    else if(p.type==='ring'&&!p.soft){ctx.globalAlpha=k;ctx.strokeStyle=p.col;ctx.lineWidth=p.w*k+.5;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.stroke();}}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
}

const DEF={drone:{hp:2,r:15,score:100,ex:1,air:1},inter:{hp:7,r:18,score:300,ex:1.3,air:1},gun:{hp:24,r:26,score:800,ex:1.9,air:1},bomber:{hp:120,r:40,score:5000,ex:3,air:1},
  boat:{hp:16,r:16,score:600,ex:1.5,air:0},destroyer:{hp:130,r:30,score:6000,ex:3.2,air:0},turret:{hp:14,r:12,score:400,ex:1.1,air:0},rail:{hp:70,r:22,score:3000,ex:2,air:0},
  emissile:{hp:1,r:7,score:50,ex:.6,air:1},carrier:{hp:680,r:100,score:50000,ex:5,air:0},aegis:{hp:900,r:100,score:60000,ex:5,air:1}};
function enemy(type,x,y,o={}){const d=DEF[type];const e=Object.assign({type,x,y,vx:0,vy:0,ang:PI,t:0,r:d.r,air:!!d.air,fireT:rand(.8,2.2),flash:0,children:[],layer:d.air?1:0,st:0},o);
  e.hp=d.hp*G.hpS*(o.hpMul||1);if(type==='drone'&&!e.shooter&&Math.random()<DF().shoot)e.shooter=true;e.maxhp=e.hp;e.px=x;e.py=y;G.enemies.push(e);return e;}

function turret(parent,ox,oy,big,hpMul=1){const t=enemy('turret',parent.x+ox,parent.y+oy,{beh:'turret',parent,ox,oy,aa:PI/2,big,hpMul,layer:parent.layer===1?2:.5,fireT:rand(1,2.2),fixAng:true});parent.children.push(t);return t;}
function launchMissile(x,y){enemy('emissile',x,y,{beh:'missile',spd:70,head:-PI/2+rand(-.7,.7),life:6.5,layer:1,fixAng:true,trailT:0});sfx('emissile');}
function ebullet(x,y,a,spd,k=0){G.eb.push({x,y,vx:Math.cos(a)*spd*G.bulS,vy:Math.sin(a)*spd*G.bulS,r:6,k});}
function aimAt(x,y){const p=nearestPlayer(x,y);return p?Math.atan2(p.y-y,p.x-x):PI/2;}
function fanAt(x,y,n,spread,spd,k=1,base){const a0=base??aimAt(x,y);for(let i=0;i<n;i++)ebullet(x,y,a0+(i-(n-1)/2)*spread,spd,k);}
function ringAt(x,y,n,spd,off=0,k=2){for(let i=0;i<n;i++)ebullet(x,y,off+i/n*TAU,spd,k);}
const onScreen=e=>e.y>16&&e.y<H*.72&&e.x>10&&e.x<W-10;
function wake(e,dt){e.wakeT-=dt;if(e.wakeT>0)return;e.wakeT=.045;
  P({type:'wake',x:e.x+rand(-e.ww,e.ww),y:e.y+e.hh*.96,vx:rand(-30,30),size:rand(6,12)*e.ws,grow:16*e.ws,life:2.4,scroll:1,layer:0,drag:.6});
  for(const s of[-1,1])P({type:'wake',x:e.x+s*e.hw*.9,y:e.y-e.hh*.75,vx:s*rand(20,45),size:rand(3,6)*e.ws,grow:8,life:1.4,scroll:1,layer:0,drag:.8});}
const BEH={
  straight(e,dt){e.x+=e.vx*dt;e.y+=e.vy*dt;},
  sine(e,dt){e.y+=e.spd*dt;e.x=e.x0+Math.sin(e.t*e.w+e.ph)*e.A;},
  swoop(e,dt){if(e.t<e.turnAt){e.vx=0;e.vy=e.spd;}else{const k=Math.min(1,(e.t-e.turnAt)*1.2);e.vx=e.side*e.spd*1.1*k;e.vy=e.spd*(1-2*k);}e.x+=e.vx*dt;e.y+=e.vy*dt;},
  loop(e,dt){if(e.st===0){e.y+=e.spd*dt;if(e.y>=e.cy){e.st=1;e.a0=e.dir>0?0:PI;e.a=e.a0;e.cx=e.x-e.R*e.dir;}}
    else if(e.st===1){e.a+=e.spd/e.R*dt*e.dir;e.x=e.cx+Math.cos(e.a)*e.R;e.y=e.cy+Math.sin(e.a)*e.R;if(Math.abs(e.a-e.a0)>=TAU)e.st=2;}else e.y+=e.spd*dt;},

function updPickups(dt){for(const k of G.pickups){k.t+=dt;k.x+=k.vx*dt;k.y+=k.vy*dt;if(k.x<20||k.x>W-20)k.vx*=-1;
    if(k.type==='W'&&k.t>k.next){const o=['V','L','H'];k.w=o[(o.indexOf(k.w)+1)%3];k.next+=2.3;}
    for(const p of alive())if(Math.hypot(p.x-k.x,p.y-k.y)<34){applyPickup(p,k);k.dead=true;break;}}

// ============================================================ BACKGROUND
function spawnCloud(y){const hi=Math.random()<.5;G.clouds.push({spr:pick(G.cloudSpr),x:rand(-60,W+60),y:y??-120,hi,sc:hi?rand(1.1,1.6):rand(.6,.95),spd:hi?rand(200,250):rand(100,130),flip:Math.random()<.5?-1:1});}
function updBackground(dt){G.scroll+=SCROLL*dt;
  G.islandT-=dt;if(G.islandT<=0){const ice=G.stageDef.island==='ice';G.islandT=ice?rand(1.5,4):rand(6,13);const s=pick(G.islandSpr);G.bgObjs.push({spr:s,x:rand(0,W),y:-s.h/2,rot:rand(TAU)});}

  for(const c of G.clouds)c.y+=c.spd*dt;G.clouds=G.clouds.filter(c=>c.y<H+200);}
function drawOcean(){const T=512,o=G.ocean;let oy=G.scroll%T;
  for(let ty=Math.floor(oy-T);ty<H;ty+=T)for(let tx=0;tx<W;tx+=T)ctx.drawImage(o.base,tx,ty,T,T);

  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;

// ============================================================ UPDATE
function tick(dt){G.t+=dt;
  if(G.state==='title'||G.state==='howto'){updBackground(dt);updParts(dt);titleInput();return;}
  if(G.state==='play'){
    if(pressed.has('Escape')||pressed.has('KeyP')||[...padOwner.keys()].some(i=>padEdge.get(i)?.has(9))&&!G.paused){G.paused=!G.paused;if(AU.music)AU.music.gain.setTargetAtTime(G.paused?.15:.5,AU.ctx.currentTime,.1);sfx('menu');return;}
    if(G.paused){if(pressed.has('KeyQ')||anyPadEdge(8))toTitle();
      else if(anyPadEdge(9,0)||pressed.has('Enter')||pressed.has('Space')){G.paused=false;if(AU.music)AU.music.gain.setTargetAtTime(.5,AU.ctx.currentTime,.1);}return;}
    if(pressed.has('Digit2'))joinP2();
    for(const[idx,set]of padEdge){if(!set.size||padOwner.has(idx))continue;const used=new Set(padOwner.values());
      const free=G.players.find(p=>!used.has(p.id));
      if(free)padOwner.set(idx,free.id);else if(G.players.length<2){joinP2();padOwner.set(idx,1);}}
  }
  updWorld(dt);
}
function updWorld(dt){
  const playing=G.state==='play';G.stageT+=dt;updBackground(dt);
  if(playing&&G.clearT<=0&&!G.wreck){
    while(G.scriptI<G.script.length&&G.stageT>=G.script[G.scriptI][0]){WAVES[G.script[G.scriptI][1]]();G.scriptI++;}
    if(!G.bossSpawned&&G.stageT>=STAGE_LEN){G.bossSpawned=true;G.bossTimer=3.4;G.warn=3.4;stopSong();sfx('alarm');}
    if(G.bossTimer>0){G.bossTimer-=dt;if(G.bossTimer<=0)spawnBoss();}
    if(!G.bossSpawned){G.fillT-=dt;if(G.fillT<=0&&G.enemies.filter(e=>e.air).length<DF().fill){WAVES[pick(['vee','sweep','snake','inter','loopers'])]();G.fillT=rand(2.2,4)/(1+DF().d*.5);}}}
  G.banner=Math.max(0,G.banner-dt);G.warn=Math.max(0,G.warn-dt);G.shake=Math.max(0,G.shake-dt*30);G.flash=Math.max(0,G.flash-dt*1.8);
  for(const p of G.players)updPlayer(p,dt);
  updEnemies(dt);
  // player bullets
  for(const b of G.pb){
    if(b.kind==='H'){b.life-=dt;b.tT-=dt;if((!b.target||b.target.dead)&&b.tT<=0){b.target=nearestEnemy(b.x,b.y);b.tT=.15;}
      const sp=Math.min(820,Math.hypot(b.vx,b.vy)+1400*dt);let a=Math.atan2(b.vy,b.vx);if(b.target&&!b.target.dead)a=turnTo(a,Math.atan2(b.target.y-b.y,b.target.x-b.x),9*dt);
      b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;b.ang=a;if(Math.random()<.7)P({type:'smoke',x:b.x,y:b.y,size:2,grow:10,life:.35,scroll:.3});if(b.life<=0)b.dead=true;}
    b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y<-80||b.y>H+60||b.x<-60||b.x>W+60)b.dead=true;if(b.dead)continue;
    for(const e of G.enemies){if(e.dead||e.y<-30&&!e.boss||(b.pierce&&b.hit.has(e)))continue;
      if(hitTest(e,b.x,b.y,b.r)||(b.kind==='L'&&hitTest(e,b.x,b.y+b.len*.5,b.r))){damage(e,b.dmg,b.owner);
        P({type:'glow',x:b.x,y:b.y-4,size:b.kind==='L'?10:7,life:.08,col:b.kind==='L'?'#d8a0ff':b.owner.col});if(Math.random()<.3)P({type:'spark',x:b.x,y:b.y,vx:rand(-200,200),vy:rand(-200,50),size:1.2,life:.2,col:'#fff2c0',drag:3});
        if(b.pierce)b.hit.add(e);else{b.dead=true;if(b.kind==='H')explode(b.x,b.y,.45);break;}}}}
  G.pb=G.pb.filter(b=>!b.dead);
  // enemy bullets
  for(const b of G.eb){b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y<-30||b.y>H+30||b.x<-30||b.x>W+30){b.dead=true;continue;}
    for(const p of G.players){if(!p.alive)continue;if((p.x-b.x)**2+(p.y-b.y)**2<(b.r+5)**2&&p.inv<=0&&p.roll<=0&&p.entering<=0){hurtPlayer(p,20);b.dead=true;break;}
      if(p.wing)for(let k=0;k<2;k++)if((p.wx[k]-b.x)**2+(p.wy[k]-b.y)**2<(b.r+7)**2&&p.inv<=0){b.dead=true;}}}
  G.eb=G.eb.filter(b=>!b.dead);
  // air collisions
  for(const e of G.enemies){if(e.dead||!e.air||e.parent||e.layer!==1)continue;for(const p of G.players){if(!p.alive||p.roll>0||p.entering>0)continue;
    if(hitTest(e,p.x,p.y,9)){const was=p.inv<=0;hurtPlayer(p,e.type==='emissile'?25:30);if(!e.boss&&was)damage(e,e.type==='emissile'?5:10,p);}}}
  updPickups(dt);updParts(dt);
  for(const p of G.players)if(p.score>G.hi)G.hi=p.score;
  // boss wreck
  if(G.wreck){const w=G.wreck,e=w.e;w.t+=dt;w.nx-=dt;if(w.nx<=0){w.nx=.09;explode(e.x+rand(-e.hw,e.hw)*.9,e.y+rand(-e.hh,e.hh)*.9,rand(1,2.4),!e.air);}
    if(e.air){e.y+=40*dt;}else wake(e,dt);
    if(w.t>=3.4){explode(e.x,e.y,6,!e.air);for(let i=0;i<5;i++)explode(e.x+rand(-e.hw,e.hw)*.6,e.y+rand(-e.hh,e.hh)*.6,3,!e.air);G.flash=1;G.flashCol='#fff4dc';G.wreck=null;
      G.bonus=10000*G.stage;for(const p of G.players)if(!p.out)p.score+=G.bonus+Math.floor(p.energy)*100;G.clearT=6.5;sfx('fanfare');}}
  if(G.clearT>0&&playing){G.clearT-=dt;if(G.clearT<=0){G.stage++;for(const p of G.players)if(p.alive)p.energy=Math.min(100,p.energy+50);setupStage();}}
  // game over
  if(playing&&G.players.length&&G.players.every(p=>p.out)){G.overT+=dt;if(G.overT>2.2){G.state='over';G.overT=0;saveHi();stopSong();sfx('lose');}}
  if(G.state==='over'){G.overT+=dt;if(G.overT>1.5&&(menuInput().sel||mouse.pressed.has(0)||touchEdge[0]||touchEdge[1]))toTitle();}
}
function hitTest(e,x,y,r){if(e.hw)return Math.abs(x-e.x)<e.hw+r&&Math.abs(y-e.y)<e.hh+r;return(x-e.x)**2+(y-e.y)**2<(e.r+r)**2;}

  const s=e.type==='drone'?(e.red?SPR.droneR:SPR.drone):e.type==='emissile'?SPR.emiss:SPR[e.type];

  const gr=ctx.createRadialGradient(-r*.3,-r*.3,1,0,0,r);gr.addColorStop(0,'#7a8693');gr.addColorStop(1,'#2a3038');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
