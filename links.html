<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links · BitJunky's</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060f;--panel:rgba(8,12,34,.78);--line:#1b2a6b;--blue:#2f6bff;--cyan:#27f0ff;--pink:#ff2d95;--yellow:#ffe94a;--text:#cfd8ff;--dim:#7684c4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.55 'Share Tech Mono',ui-monospace,monospace;min-height:100vh}
#grid{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:60px 22px 60px}
a{color:var(--cyan);text-decoration:none}
.back{display:inline-block;border:1px solid var(--cyan);padding:6px 14px;background:rgba(39,240,255,.06);transition:.15s}
.back:hover,.back:focus-visible{background:var(--cyan);color:#021;box-shadow:0 0 18px var(--cyan);outline:none}
h1{font:900 clamp(2.2rem,8vw,4rem)/1.1 Orbitron,sans-serif;margin:28px 0 8px;color:#fff;text-shadow:0 0 8px var(--cyan),0 0 26px var(--blue),3px 0 var(--pink)}
.sub{color:var(--dim);margin:0 0 22px}
input{width:100%;background:#03040c;border:1px solid var(--line);color:var(--text);font:inherit;padding:10px 12px;margin-bottom:10px}
input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 12px rgba(39,240,255,.4)}
h2{font:700 1.15rem Orbitron,sans-serif;margin:34px 0 12px;color:var(--yellow);letter-spacing:.06em}
.list{display:grid;gap:10px}
.link{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:12px 16px;backdrop-filter:blur(3px);transition:.2s}
.link:hover,.link:focus-visible{border-color:var(--pink);box-shadow:0 0 20px rgba(255,45,149,.35);transform:translateX(4px);outline:none}
.ico{font-size:1.5rem;width:2rem;text-align:center}
.t{color:#fff;font-weight:bold}
.d{color:var(--dim);font-size:.9rem}
.host{margin-left:auto;color:var(--dim);font-size:.8rem;white-space:nowrap}
.none{color:var(--dim);display:none}
@media (max-width:560px){.host{display:none}}
@media (prefers-reduced-motion:reduce){.link{transition:none}}
</style>
</head>
<body>
<canvas id="grid" aria-hidden="true"></canvas>
<main>
  <a class="back" href="index.html">← BitJunky's</a>
  <h1>Links</h1>
  <p class="sub">Stuff worth bookmarking.</p>
  <input id="q" type="search" placeholder="Filter links..." aria-label="Filter links">
  <p class="sub" id="status" style="font-size:.85rem;margin:0 0 6px"></p>
  <div id="out"></div>
  <p class="none" id="none">No links match.</p>
</main>

<script src="links.js"></script>
<script>
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const host = u => { try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } };
const CFG = Object.assign(
  {enabled:true, repo:'', group:'Pages', exclude:['index.html','links.html','404.html'], max:40, ttlMin:30},
  typeof AUTO_LINKS!=='undefined' ? AUTO_LINKS : {});
const out = document.getElementById('out'), statusEl = document.getElementById('status'), qEl = document.getElementById('q');
let autoItems = [];
const groups = () => autoItems.length ? LINKS.concat([{group:CFG.group, items:autoItems}]) : LINKS;
function render(filter){
  const f = (filter||'').trim().toLowerCase();
  let total = 0;
  out.innerHTML = groups().map(g => {
    const items = g.items.filter(i => !f || (i.title+' '+(i.desc||'')+' '+i.url+' '+g.group).toLowerCase().includes(f));
    total += items.length;
    if(!items.length) return '';
    return `<h2>${esc(g.group)}</h2><div class="list">` + items.map(i => `
      <a class="link" href="${esc(i.url)}" ${i.internal?'':'target="_blank" rel="noopener"'}>
        <span class="ico">${esc(i.icon||'🔗')}</span>
        <span><span class="t">${esc(i.title)}</span><br><span class="d">${esc(i.desc||'')}</span></span>
        <span class="host">${esc(i.host!==undefined ? i.host : host(i.url))}</span>
      </a>`).join('') + `</div>`;
  }).join('');
  document.getElementById('none').style.display = total ? 'none' : 'block';
}
qEl.addEventListener('input', e => render(e.target.value));
render('');

/* ===== Auto-scan: finds every .html page in your repo via the GitHub API ===== */
function detectRepo(){
  if(CFG.repo) return CFG.repo;
  const h = location.hostname;
  if(!h.endsWith('.github.io')) return '';
  const owner = h.split('.')[0], seg = location.pathname.split('/')[1];
  return (seg && !seg.includes('.')) ? owner+'/'+seg : owner+'/'+h;
}
function skip(path){
  if(CFG.exclude.includes(path)) return true;
  return path.split('/').some(p => p.startsWith('.') || p.startsWith('_') || p==='node_modules');
}
async function pageInfo(path, base){
  const url = path.replace(/(^|\/)index\.html?$/i, '$1');
  try{
    const r = await fetch(base + path);
    if(!r.ok) return null;
    const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
    if(doc.querySelector('meta[name="links"][content="hide"]')) return null;
    const meta = n => (doc.querySelector(`meta[name="${n}"]`)||{}).content || '';
    return {
      title: (doc.title||'').trim() || path.split('/').pop().replace(/\.html?$/i,''),
      url: base + url, desc: meta('description'), icon: meta('icon') || '📄',
      internal: true, host: '/' + url
    };
  }catch(e){ return null; }
}
(async function scan(){
  const repo = detectRepo();
  if(!CFG.enabled) return;
  if(!repo){ statusEl.textContent = 'Auto-scan of your pages runs once this is live on github.io.'; return; }
  const key = 'bj-pages-'+repo; let cached = null;
  try{ cached = JSON.parse(localStorage.getItem(key)); }catch(e){}
  if(cached && Date.now()-cached.t < CFG.ttlMin*60000){ autoItems = cached.items; render(qEl.value); return; }
  statusEl.textContent = 'Scanning for pages...';
  try{
    const [owner,name] = repo.split('/');
    const base = name.toLowerCase()===owner.toLowerCase()+'.github.io' ? location.origin+'/' : location.origin+'/'+name+'/';
    const r = await fetch(`https://api.github.com/repos/${repo}/git/trees/HEAD?recursive=1`);
    if(!r.ok) throw new Error(r.status);
    const tree = (await r.json()).tree;
    const files = tree.filter(f => f.type==='blob' && /\.html?$/i.test(f.path) && !skip(f.path)).slice(0,CFG.max).map(f => f.path);
    const items = (await Promise.all(files.map(p => pageInfo(p, base)))).filter(Boolean);
    items.sort((a,b) => a.title.localeCompare(b.title));
    autoItems = items;
    try{ localStorage.setItem(key, JSON.stringify({t:Date.now(), items})); }catch(e){}
    statusEl.textContent = '';
  }catch(e){
    if(cached){ autoItems = cached.items; statusEl.textContent = ''; }
    else statusEl.textContent = 'Could not scan pages right now (GitHub rate limit?). Try again later.';
  }
  render(qEl.value);
})();

/* Warping grid (same look as the home page, without the game) */
(function(){
  const cv=document.getElementById('grid'), ctx=cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COLORS=[0,1,2,3,4,5].map(b=>{const k=b/5;return `rgba(${Math.round(30+225*k)},${Math.round(80+130*(1-k*.4)+40*k)},255,${(.28+.62*k).toFixed(2)})`});
  let W,H,cols,rows,pts,gap,mx=-9999,my=-9999,pmx=-9999,pmy=-9999;
  function init(){
    const dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    gap=W<600?28:34; cols=Math.ceil(W/gap)+2; rows=Math.ceil(H/gap)+2; pts=[];
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const x=c*gap-gap/2,y=r*gap-gap/2;pts.push({ox:x,oy:y,x,y,vx:0,vy:0,b:0});}
    if(reduce) draw();
  }
  function push(x,y,rad,f){
    if(reduce) return;
    const c0=Math.max(0,Math.floor((x-rad)/gap+.5)),c1=Math.min(cols-1,Math.ceil((x+rad)/gap+.5));
    const r0=Math.max(0,Math.floor((y-rad)/gap+.5)),r1=Math.min(rows-1,Math.ceil((y+rad)/gap+.5));
    for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
      const p=pts[r*cols+c],dx=p.x-x,dy=p.y-y,d2=dx*dx+dy*dy;
      if(d2<rad*rad&&d2>1){const d=Math.sqrt(d2),k=(1-d/rad)*f;p.vx+=dx/d*k;p.vy+=dy/d*k;}
    }
  }
  addEventListener('pointermove',e=>{pmx=mx;pmy=my;mx=e.clientX;my=e.clientY;if(pmx>-999)push(mx,my,140,-Math.min(Math.hypot(mx-pmx,my-pmy)*.12,5));});
  addEventListener('pointerdown',e=>push(e.clientX,e.clientY,260,28));
  addEventListener('touchmove',e=>{const t=e.touches[0];push(t.clientX,t.clientY,140,-3);},{passive:true});
  addEventListener('resize',init);
  function physics(){
    for(const p of pts){
      p.vx+=(p.ox-p.x)*.045;p.vy+=(p.oy-p.y)*.045;p.vx*=.9;p.vy*=.9;p.x+=p.vx;p.y+=p.vy;
      p.b=Math.min(5,Math.floor(Math.min(Math.hypot(p.x-p.ox,p.y-p.oy)/22,1)*6));
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H); ctx.lineWidth=1.2;
    const paths=COLORS.map(()=>new Path2D());
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const p=pts[r*cols+c];
      if(c<cols-1){const q=pts[r*cols+c+1],P=paths[Math.max(p.b,q.b)];P.moveTo(p.x,p.y);P.lineTo(q.x,q.y);}
      if(r<rows-1){const q=pts[(r+1)*cols+c],P=paths[Math.max(p.b,q.b)];P.moveTo(p.x,p.y);P.lineTo(q.x,q.y);}
    }
    for(let i=0;i<6;i++){ctx.strokeStyle=COLORS[i];ctx.stroke(paths[i]);}
  }
  const STEP=1/120; let last=0,acc=0;
  function frame(t){
    const dt=Math.min((t-last)/1000,.1); last=t; acc+=dt; let n=0;
    while(acc>=STEP&&n<6){physics();acc-=STEP;n++;} if(n===6)acc=0;
    draw(); requestAnimationFrame(frame);
  }
  init(); if(!reduce){ last=performance.now(); requestAnimationFrame(frame); }
})();
</script>
</body>
</html>
